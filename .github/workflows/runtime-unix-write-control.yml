name: Runtime Unix Write Premise Probe

on:
  workflow_dispatch:
  push:
    branches: [runtime-exit-integrity-native-candidates]
    paths:
      - .github/workflows/runtime-unix-write-control.yml
      - scripts/diagnostics/diagnose-unix-exit-tail-v2.mjs

permissions:
  contents: read

concurrency:
  group: runtime-unix-write-control-${{ github.ref }}
  cancel-in-progress: false

jobs:
  unix-write-control:
    name: Write premise / ${{ matrix.os }} / Node 22
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Check syntax
        run: node --check scripts/diagnostics/diagnose-unix-exit-tail-v2.mjs
      - name: Check positive reads and independent watchdog
        run: |
          node --input-type=module -e '
            import fs from "node:fs";
            import { spawnSync } from "node:child_process";
            const r = spawnSync(process.execPath, ["scripts/diagnostics/diagnose-unix-exit-tail-v2.mjs", "--self-test"], { encoding: "utf8", timeout: 30000 });
            process.stdout.write(r.stdout || "");
            process.stderr.write(r.stderr || "");
            fs.mkdirSync("write-control-selftest", { recursive: true });
            fs.writeFileSync("write-control-selftest/result.json", JSON.stringify(r, null, 2));
            if (r.status !== 0) process.exit(1);
            const report = JSON.parse(r.stdout.trim());
            fs.cpSync(report.watchdogEvidence, "write-control-selftest/watchdog", { recursive: true });
          '
      - name: Run full 27-sample schedule
        run: node scripts/diagnostics/diagnose-unix-exit-tail-v2.mjs --output write-control-evidence
      - name: Verify all saved results including failures
        if: always()
        run: node scripts/diagnostics/diagnose-unix-exit-tail-v2.mjs --verify-saved write-control-evidence
      - name: Upload complete first evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runtime-unix-write-control-${{ matrix.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            write-control-evidence/
            write-control-selftest/
          if-no-files-found: warn
          retention-days: 14
