name: Publish Marketplace Release
on:
  workflow_dispatch:
    inputs:
      version:
        description: '产品版本 X.Y.Z；从 main 执行发布工具'
        type: string
        required: true
      batch_run_id:
        description: 'Build Release Batch 的成功 run ID；仅历史完整 Release 重试可留空'
        type: string
        required: false
      batch_attempt:
        description: '已验收批次 attempt；重试必须保留原值'
        type: string
        default: '1'
      target:
        description: '历史渠道恢复范围；VSM 保持 deferred'
        type: choice
        options: [all, open-vsx]
        default: all
permissions:
  contents: write
  actions: read
concurrency:
  group: marketplace-release-${{ inputs.version }}
  cancel-in-progress: false
jobs:
  resolve-release:
    name: Release resolve-release
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    outputs:
      input_sha: ${{ steps.resolve.outputs.input_sha }}
      base_sha: ${{ steps.resolve.outputs.base_sha }}
      version: ${{ steps.resolve.outputs.version }}
      mode: ${{ steps.resolve.outputs.mode }}
      trigger_tag: ${{ steps.resolve.outputs.trigger_tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.3
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install locked resolver dependencies
        run: node scripts/gates/run-infrastructure.mjs --kind install --profile plugin --output resolve-evidence -- npm ci --no-audit --no-fund
        timeout-minutes: 10
      - name: Freeze release identity and recovery scope
        id: resolve
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_TARGET: ${{ inputs.target }}
          BATCH_RUN_ID: ${{ inputs.batch_run_id }}
          BATCH_ATTEMPT: ${{ inputs.batch_attempt }}
        run: |
          set -euo pipefail
          git fetch origin --tags
          batch_args=()
          if [[ -n "$BATCH_RUN_ID" ]]; then
            batch_args=(--batch-run-id "$BATCH_RUN_ID" --batch-attempt "$BATCH_ATTEMPT")
          fi
          node scripts/release/publish-tag-release.mjs --phase resolve --version "$RELEASE_VERSION" --trigger-tag "publish/v$RELEASE_VERSION" --target "$RELEASE_TARGET" --run-head "$GITHUB_SHA" --output release-context "${batch_args[@]}"
      - name: Upload frozen release context
        if: ${{ success() }}
        uses: actions/upload-artifact@v4
        with:
          name: release-context-${{ github.run_id }}-${{ github.run_attempt }}
          path: release-context/release-context.json
          retention-days: 90
          if-no-files-found: error
      - name: Preserve resolution failure
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: release-resolve-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            release-context/release-failure.json
            resolve-evidence
          retention-days: 90
          if-no-files-found: warn
  verify-release:
    name: Verify release
    needs: resolve-release
    uses: ./.github/workflows/release-validation.yml
    with:
      input_sha: ${{ needs.resolve-release.outputs.input_sha }}
      base_sha: ${{ needs.resolve-release.outputs.base_sha }}
      version: ${{ needs.resolve-release.outputs.version }}
      mode: ${{ needs.resolve-release.outputs.mode }}
      trigger_tag: ${{ needs.resolve-release.outputs.trigger_tag }}
  prepare-release:
    name: Release prepare-release
    needs: [resolve-release, verify-release]
    if: ${{ always() && needs.resolve-release.result == 'success' && needs.verify-release.result == 'success' && needs.verify-release.outputs.accepted == 'true' }}
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.3
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install locked delivery dependencies
        run: node scripts/gates/run-infrastructure.mjs --kind install --profile plugin --output prepare-evidence -- npm ci --no-audit --no-fund
        timeout-minutes: 10
      - name: Download frozen release context
        uses: actions/download-artifact@v4
        with:
          name: release-context-${{ github.run_id }}-${{ github.run_attempt }}
          path: release-context
      - name: Deliver and download-verify accepted original pair
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release/publish-tag-release.mjs --phase prepare --context release-context/release-context.json --output release-prepare
      - name: Upload prepared original pair
        if: ${{ success() }}
        uses: actions/upload-artifact@v4
        with:
          name: prepared-release-${{ github.run_id }}-${{ github.run_attempt }}
          path: release-prepare/prepared
          include-hidden-files: true
          retention-days: 90
          if-no-files-found: error
      - name: Preserve prepare evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: release-prepare-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            release-prepare/release-failure.json
            release-prepare/prepared/release-manifest-*.json
            release-prepare/prepared/state-*.json
            prepare-evidence
          retention-days: 90
          if-no-files-found: warn
  publish-open-vsx:
    name: Release publish-open-vsx
    needs: [resolve-release, prepare-release]
    if: ${{ needs.prepare-release.result == 'success' }}
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.3
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install locked channel dependencies
        run: node scripts/gates/run-infrastructure.mjs --kind install --profile plugin --output channel-result -- npm ci --no-audit --no-fund
        timeout-minutes: 10
      - name: Download prepared original pair
        uses: actions/download-artifact@v4
        with:
          name: prepared-release-${{ github.run_id }}-${{ github.run_attempt }}
          path: prepared
      - name: Query submit and verify original Open VSX bytes
        id: publish
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: node scripts/release/publish-marketplaces.mjs --context prepared/release-context.json --prepared prepared --target open-vsx --output channel-result
      - name: Upload Open VSX result
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: marketplace-result-open-vsx-${{ github.run_id }}-${{ github.run_attempt }}
          path: channel-result
          include-hidden-files: true
          retention-days: 90
          if-no-files-found: error
      - name: Fail incomplete required channel
        if: ${{ steps.publish.outputs.complete != 'true' }}
        run: exit 1
  finalize-release:
    name: Release finalize-release
    needs: [resolve-release, prepare-release, publish-open-vsx]
    if: ${{ always() && needs.prepare-release.result == 'success' }}
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.3
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install locked completion verifier
        run: node scripts/gates/run-infrastructure.mjs --kind install --profile plugin --output final-result -- npm ci --no-audit --no-fund
        timeout-minutes: 10
      - name: Download prepared original pair
        uses: actions/download-artifact@v4
        with:
          name: prepared-release-${{ github.run_id }}-${{ github.run_attempt }}
          path: prepared
      - name: Verify actual channel jobs and finalize state
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release/publish-tag-release.mjs --phase finalize --context prepared/release-context.json --input prepared --output final-result
      - name: Preserve final state and failure evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: marketplace-release-${{ github.run_id }}-${{ github.run_attempt }}
          path: final-result
          include-hidden-files: true
          retention-days: 90
          if-no-files-found: error
