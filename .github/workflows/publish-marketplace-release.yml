name: Publish Marketplace Release

on:
  create:
  workflow_dispatch:
    inputs:
      trigger_tag:
        description: 'Temporary publish tag, for example publish/v0.14.2'
        required: true
        type: string

permissions:
  contents: write

jobs:
  publish:
    name: Publish VS Code Marketplace Artifacts
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'create' && github.event.ref_type == 'tag' && startsWith(github.event.ref, 'publish/v')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      group: marketplace-release-${{ github.event_name == 'workflow_dispatch' && inputs.trigger_tag || github.event.ref }}
      cancel-in-progress: false
    env:
      OVSX_PAT: ${{ secrets.OVSX_PAT }}
      VSCE_PAT: ${{ secrets.VSCE_PAT }}
      TRIGGER_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.trigger_tag || github.event.ref }}
    steps:
      - name: Checkout release ref
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: refs/tags/${{ github.event_name == 'workflow_dispatch' && inputs.trigger_tag || github.event.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify publishing secrets
        run: |
          test -n "$VSCE_PAT" || { echo "VSCE_PAT secret is required."; exit 1; }
          test -n "$OVSX_PAT" || { echo "OVSX_PAT secret is required."; exit 1; }

      - name: Publish and finalize release tag
        run: npm run release:publish-tag -- --trigger-tag "$TRIGGER_TAG" --delete-trigger-tag

      - name: Upload release artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: marketplace-release-${{ github.run_id }}
          path: |
            release-artifacts/
            dev-session-canvas-*.vsix
            extensions/vscode/dev-session-canvas-notifier/dev-session-canvas-notifier-*.vsix
          if-no-files-found: warn
