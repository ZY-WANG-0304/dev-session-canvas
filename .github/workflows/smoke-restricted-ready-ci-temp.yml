name: Temporary Restricted Ready Investigation
on:
  push:
    branches: [smoke-restricted-ready-ci-temp]
    paths: [.github/workflows/smoke-restricted-ready-ci-temp.yml]
permissions:
  contents: read
  actions: read
jobs:
  causal-restricted:
    strategy:
      fail-fast: false
      matrix:
        timing: [during, before]
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    env:
      DSC_READY_TIMING: ${{ matrix.timing }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 9198cacbee91fc170b82578e353c16a27f3574b8
      - name: Extract diagnostic script from temporary workflow commit
        run: git fetch --depth=1 origin "${{ github.sha }}" && git show "${{ github.sha }}:restricted-ready-probe.py" > restricted-ready-probe.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 38665513172
          pattern: execution-native-*-38665513172
          merge-multiple: true
          path: archives
      - name: Assemble fixed formal-input assets
        run: |
          node scripts/build/assemble-execution-distribution-assets.mjs --source archives --output platform --input-sha 9198cacbee91fc170b82578e353c16a27f3574b8
          echo "DEV_SESSION_CANVAS_EXECUTION_ASSETS_SET=$GITHUB_WORKSPACE/platform" >> "$GITHUB_ENV"
      - name: Add read-only stage records
        run: python3 restricted-ready-probe.py
      - name: Control original ready delivery timing
        env:
          DEV_SESSION_CANVAS_SMOKE_SCENARIO_FILTER: restricted
        run: |
          set +e
          timeout --signal=TERM --kill-after=20s 180s npm run test:smoke > restricted.log 2>&1
          status=$?
          echo "$status" > restricted.exit
          python3 - <<'PYCONTROL'
          from pathlib import Path
          import json,os
          code=int(Path('restricted.exit').read_text())
          log=Path('restricted.log').read_text()
          mode=os.environ['DSC_READY_TIMING']
          gates=[json.loads(line.split('[ready-gate] ',1)[1]) for line in log.splitlines() if '[ready-gate] ' in line]
          if mode=='during':
            delivered=next(x for x in gates if x['stage']=='original-ready-delivered-during-diagnostic')
            restored=next(x for x in gates if x['stage']=='after-diagnostic-restore')
            assert delivered['ready'] and delivered['active']=='panel'
            assert restored['ready'] is False and restored['active']=='editor'
            assert code==1 and 'Timed out waiting for the editor Canvas to become ready (20000ms).' in log
          else:
            before=next(x for x in gates if x['stage']=='original-editor-ready-before-diagnostic')
            after=next(x for x in gates if x['stage']=='after-diagnostic-preserved-ready')
            assert before['snapshot']['surfaceReady']['editor'] and after['snapshot']['surfaceReady']['editor']
            assert code==0 and 'Restricted workspace smoke passed.' in log
          Path('control-result.json').write_text(json.dumps({'mode':mode,'smoke_exit':code,'causal_assertions':'passed','gates':gates},indent=2)+'\n')
          print(json.dumps({'mode':mode,'smoke_exit':code,'causal_assertions':'passed'}))
          PYCONTROL
          exit "$?"
      - name: Preserve original restricted evidence
        if: always()
        run: |
          python3 - <<'PYFILES'
          from pathlib import Path
          import tarfile
          roots=[Path('restricted.log'),Path('restricted.exit'),Path('probe-inputs.json'),Path('control-result.json'),Path('.debug/vscode-smoke/restricted/artifacts'),Path('.debug/vscode-smoke/restricted/user-data/logs')]
          with tarfile.open('restricted-evidence.tar.gz','w:gz') as tar:
            for root in roots:
              if root.exists():tar.add(root)
          PYFILES
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: causal-restricted-${{ matrix.timing }}-${{ github.run_id }}
          path: restricted-evidence.tar.gz
