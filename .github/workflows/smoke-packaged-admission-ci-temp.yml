name: Temporary Packaged Admission Root Cause
on:
  push:
    branches: [smoke-lifecycle-release-ci-temp]
    paths: [.github/workflows/smoke-packaged-admission-ci-temp.yml]
permissions: {contents: read, actions: read}
jobs:
  packaged-admission:
    strategy:
      fail-fast: false
      matrix: {control: [natural, hold-deletion, wait-retirement]}
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0, ref: f8d9ad5341f8a20a7cbd97fda6beb01e71937ddc}
      - name: Extract finite diagnostic from workflow ref
        run: git fetch origin "${{ github.sha }}" && git show "${{ github.sha }}:packaged-admission-probe.py" > packaged-admission-probe.py
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm}
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 38681093813
          pattern: execution-native-*-38681093813
          merge-multiple: true
          path: archives
      - run: |
          node scripts/build/assemble-execution-distribution-assets.mjs --source archives --output platform --input-sha f8d9ad5341f8a20a7cbd97fda6beb01e71937ddc
          echo "DEV_SESSION_CANVAS_EXECUTION_ASSETS_SET=$GITHUB_WORKSPACE/platform" >> "$GITHUB_ENV"
          echo "DSC_PACKAGED_ADMISSION_TRACE=$RUNNER_TEMP/packaged-admission.jsonl" >> "$GITHUB_ENV"
      - run: python3 packaged-admission-probe.py
      - name: Observe original packaged trusted with isolated HOME and npm ci
        env:
          DEV_SESSION_CANVAS_SMOKE_SCENARIO_FILTER: trusted
          DSC_PACKAGED_CONTROL: ${{ matrix.control }}
        run: |
          set +e
          timeout --signal=TERM --kill-after=20s 420s npm run validate:clean-checkout:vsix -- --source working-tree --keep-temp > packaged.log 2>&1
          code=$?
          echo "$code" > packaged.exit
          python3 - <<'PY'
          import os,json,re
          from pathlib import Path
          control=os.environ['DSC_PACKAGED_CONTROL'];code=int(Path('packaged.exit').read_text());log=Path('packaged.log').read_text()
          trace=Path(os.environ['DSC_PACKAGED_ADMISSION_TRACE']);events=[json.loads(l) for l in trace.read_text().splitlines()] if trace.exists() else []
          markers=[json.loads(l.split('[packaged-admission] ',1)[1]) for l in log.splitlines() if '[packaged-admission] ' in l]
          Path('admission-result.json').write_text(json.dumps({'control':control,'exit':code,'events':events,'markers':markers},indent=2)+'\n')
          if control=='hold-deletion':
            ids=next(m['ids'] for m in markers if m['stage']=='before-stop')
            rejection=next(e for e in events if e['stage']=='capacity-rejected')
            assert rejection['detail']['retainedRetirements']+rejection['detail']['owned']['admissionPending']==2
            admission=next(e for e in events if e['stage']=='create-admission' and e['detail']['sessionId']==rejection['detail']['sessionId'])
            assert all(any(s['id']==i for s in admission['detail']['sessions']) for i in ids)
            assert code==1 and 'Execution start was rejected-before-acquire.' in log and 'at async verifyLiveRuntimePersistence' in log
            assert all(any(e['stage']=='remove-finished' and e['detail']['sessionId']==i and e['at']>rejection['at'] for e in events) for i in ids)
          elif control=='wait-retirement':
            assert any(m['stage']=='both-retired' for m in markers)
            assert code==0 and 'VSIX packaged-payload smoke passed (trusted).' in log
          else:
            assert code in (0,1) and markers
          print(json.dumps({'control':control,'smoke_exit':code,'causal_assertions':'passed'}))
          PY
      - name: Collect bounded original diagnostics
        if: always()
        run: |
          python3 - <<'PY'
          import os,re,tarfile
          from pathlib import Path
          with tarfile.open('admission-evidence.tar.gz','w:gz') as tar:
            for p in [Path('packaged.log'),Path('packaged.exit'),Path('admission-result.json'),Path('packaged-admission-probe-input.json'),Path(os.environ['DSC_PACKAGED_ADMISSION_TRACE'])]:
              if p.exists():tar.add(p,arcname=p.name)
            text=Path('packaged.log').read_text() if Path('packaged.log').exists() else ''
            matches=re.findall(r'准备隔离 clean checkout 验证目录: (.+)',text)
            if matches:
              root=Path(matches[-1]);debug=root/'.debug/vscode-vsix-smoke/smoke-runtime'
              for p in [debug/'artifacts',debug/'user-data/logs']:
                if p.exists():tar.add(p,arcname=str(p.relative_to(root)))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: 'packaged-admission-${{ matrix.control }}-${{ github.run_id }}', path: admission-evidence.tar.gz}
