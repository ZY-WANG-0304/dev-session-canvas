name: Temporary Fallback Reopen Stage Diagnosis
on:
  push:
    branches: [smoke-lifecycle-release-ci-temp]
    paths: [.github/workflows/smoke-fallback-stage-ci-temp.yml]
permissions: {contents: read, actions: read}
jobs:
  fallback-stage:
    strategy:
      fail-fast: false
      matrix: {sample: [1, 2]}
    runs-on: ubuntu-22.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0, ref: f8d9ad5341f8a20a7cbd97fda6beb01e71937ddc}
      - name: Extract stage-only probe
        run: git fetch origin "${{ github.sha }}" && git show "${{ github.sha }}:fallback-stage-probe.py" > fallback-stage-probe.py
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm}
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 38681093813
          pattern: execution-native-*-38681093813
          merge-multiple: true
          path: archives
      - run: |
          node scripts/build/assemble-execution-distribution-assets.mjs --source archives --output platform --input-sha f8d9ad5341f8a20a7cbd97fda6beb01e71937ddc
          echo "DEV_SESSION_CANVAS_EXECUTION_ASSETS_SET=$GITHUB_WORKSPACE/platform" >> "$GITHUB_ENV"
      - run: python3 fallback-stage-probe.py
      - name: Bounded original fallback scenario
        env:
          DEV_SESSION_CANVAS_SMOKE_SCENARIO_FILTER: systemd-fallback-real-reopen
        run: |
          set +e
          timeout --signal=TERM --kill-after=20s 240s npm run test:smoke > fallback.log 2>&1
          code=$?
          echo "$code" > fallback.exit
          python3 - <<'PYRESULT'
          from pathlib import Path
          import json
          lines=Path('fallback.log').read_text().splitlines()
          stages=[json.loads(x.split('[fallback-stage] ',1)[1]) for x in lines if '[fallback-stage] ' in x]
          code=int(Path('fallback.exit').read_text())
          Path('fallback-result.json').write_text(json.dumps({'exit':code,'stages':stages,'passed':any('Systemd unavailable before submission real window reopen smoke passed.' in x for x in lines)},indent=2)+'\n')
          print(json.dumps({'exit':code,'stages':stages}))
          PYRESULT
          exit "$code"
      - name: Preserve probe and original logs
        if: always()
        run: |
          python3 - <<'PYFILES'
          from pathlib import Path
          import tarfile
          with tarfile.open('fallback-evidence.tar.gz','w:gz') as tar:
            for root in [Path('fallback.log'),Path('fallback.exit'),Path('fallback-result.json'),Path('fallback-stage-inputs.json'),Path('.debug/vscode-smoke/systemd-fallback-real-reopen')]:
              if root.exists():tar.add(root)
          PYFILES
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: 'fallback-stage-${{ matrix.sample }}-${{ github.run_id }}', path: fallback-evidence.tar.gz}
