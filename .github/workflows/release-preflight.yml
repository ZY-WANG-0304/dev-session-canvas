name: Release Preflight

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: release-preflight-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  resolve-input:
    name: Resolve validation input
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    outputs:
      input_sha: ${{ steps.input.outputs.input_sha }}
      base_sha: ${{ steps.input.outputs.base_sha }}
      head_sha: ${{ steps.input.outputs.head_sha }}
      route: ${{ steps.control.outputs.route }}
      selection: ${{ steps.control.outputs.selection }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve current base, head and pre-merge input
        id: input
        shell: bash
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BASE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          input_sha="$(git rev-parse HEAD)"
          if [[ "$GITHUB_EVENT_NAME" == pull_request ]]; then
            base_sha="$PR_BASE"
            head_sha="$PR_HEAD"
            test "$(git rev-parse HEAD^1)" = "$base_sha"
            test "$(git rev-parse HEAD^2)" = "$head_sha"
          else
            base_sha="${PUSH_BASE:-$(git rev-parse HEAD^1)}"
            if [[ "$base_sha" == 0000000000000000000000000000000000000000 ]]; then base_sha="$(git rev-parse HEAD^1)"; fi
            head_sha="$input_sha"
          fi
          {
            echo "input_sha=$input_sha"
            echo "base_sha=$base_sha"
            echo "head_sha=$head_sha"
          } >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.3
      - name: Inspect merge scope
        id: inspect
        env:
          GH_TOKEN: ${{ github.token }}
          GATE_INPUT: ${{ steps.input.outputs.input_sha }}
          GATE_BASE: ${{ steps.input.outputs.base_sha }}
          GATE_HEAD: ${{ steps.input.outputs.head_sha }}
        run: node scripts/gates/merge-control.mjs --command inspect --input "$GATE_INPUT" --base "$GATE_BASE" --head "$GATE_HEAD" --output merge-control
      - name: Install verifier only for business validation
        if: ${{ steps.inspect.outputs.dependencies == 'true' }}
        run: node scripts/gates/run-infrastructure.mjs --kind install --profile plugin --output gate-results -- npm ci --no-audit --no-fund
      - name: Plan execution or verified reuse
        id: control
        env:
          GH_TOKEN: ${{ github.token }}
          GATE_INPUT: ${{ steps.input.outputs.input_sha }}
          GATE_BASE: ${{ steps.input.outputs.base_sha }}
          GATE_HEAD: ${{ steps.input.outputs.head_sha }}
          GATE_PR: ${{ github.event.pull_request.number }}
        run: |
          args=(--command prepare --input "$GATE_INPUT" --base "$GATE_BASE" --head "$GATE_HEAD" --output merge-control)
          if [[ -n "$GATE_PR" ]]; then args+=(--pr "$GATE_PR"); fi
          node scripts/gates/merge-control.mjs "${args[@]}"
      - uses: actions/upload-artifact@v4
        with:
          name: merge-control-${{ github.run_id }}-${{ github.run_attempt }}
          path: merge-control/merge-control.json
          if-no-files-found: error
          retention-days: 14

  validation:
    name: Validate immutable input
    needs: resolve-input
    if: ${{ needs.resolve-input.outputs.route == 'execute' }}
    uses: ./.github/workflows/ci-validation.yml
    secrets:
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
    with:
      input_sha: ${{ needs.resolve-input.outputs.input_sha }}
      base_sha: ${{ needs.resolve-input.outputs.base_sha }}
      head_sha: ${{ needs.resolve-input.outputs.head_sha }}
      mode: pr
      selection: ${{ needs.resolve-input.outputs.selection }}

  verify-release-contract:
    name: Verify release contract
    needs: [resolve-input, validation]
    if: ${{ always() && (github.event_name != 'pull_request' || github.event.pull_request.draft == false) }}
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve-input.outputs.input_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.3
          # The documentation path installs no workspace dependencies.
      - name: Install acceptance verifier
        if: ${{ needs.resolve-input.outputs.route != 'documentation' }}
        run: node scripts/gates/run-infrastructure.mjs --kind install --profile plugin --output gate-results -- npm ci --no-audit --no-fund
      - uses: actions/download-artifact@v4
        with:
          name: merge-control-${{ github.run_id }}-${{ github.run_attempt }}
          path: merge-control
      - name: Require independently verified complete acceptance
        env:
          GH_TOKEN: ${{ github.token }}
          RESOLVE_RESULT: ${{ needs.resolve-input.result }}
          GATE_INPUT: ${{ needs.resolve-input.outputs.input_sha }}
          GATE_BASE: ${{ needs.resolve-input.outputs.base_sha }}
          GATE_HEAD: ${{ needs.resolve-input.outputs.head_sha }}
        run: |
          set -euo pipefail
          test "$RESOLVE_RESULT" = success
          node scripts/gates/merge-control.mjs --command verify --control merge-control/merge-control.json --output checked-acceptance
      - name: Preserve independent acceptance check
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: checked-acceptance-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            checked-acceptance
            gate-results/infrastructure
          if-no-files-found: warn
