name: Temporary Lifecycle Isolation Release Verification
on:
  push:
    branches: [smoke-lifecycle-release-ci-temp]
    paths: [.github/workflows/smoke-lifecycle-release-ci-temp.yml]
permissions:
  contents: read
  actions: read
jobs:
  native-assets:
    uses: ./.github/workflows/runtime-execution-assets.yml
    with:
      input_ref: f8d9ad5341f8a20a7cbd97fda6beb01e71937ddc
  full-release:
    needs: native-assets
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.playwright-browsers
      DEV_SESSION_CANVAS_TEMPLATE_MARKETPLACE_VSCODE_E2E_HOST_TMP_ROOT: /tmp/tm-${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0, ref: f8d9ad5341f8a20a7cbd97fda6beb01e71937ddc}
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm}
      - run: npm ci
      - run: npx --no-install playwright install --with-deps chromium
      - uses: actions/download-artifact@v4
        with:
          pattern: execution-native-*-${{ github.run_id }}
          merge-multiple: true
          path: ${{ runner.temp }}/execution-native-archives
      - name: Assemble same-ref same-run assets
        run: |
          node scripts/build/assemble-execution-distribution-assets.mjs --source "$RUNNER_TEMP/execution-native-archives" --output "$RUNNER_TEMP/execution-native-platform" --input-sha f8d9ad5341f8a20a7cbd97fda6beb01e71937ddc
          echo "DEV_SESSION_CANVAS_EXECUTION_ASSETS_SET=$RUNNER_TEMP/execution-native-platform" >> "$GITHUB_ENV"
      - name: Full unchanged release gate
        shell: bash
        run: |
          set -o pipefail
          npm run release:verify -- --version 0.26.1 2>&1 | tee release-verify.log
      - name: Collect gate evidence
        if: always()
        run: |
          python3 - <<'PYFILES'
          from pathlib import Path
          import tarfile,json,subprocess
          Path('release-input.json').write_text(json.dumps({'input':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),'run':'${{ github.run_id }}','node':subprocess.check_output(['node','--version'],text=True).strip()},indent=2)+'\n')
          with tarfile.open('release-evidence.tar.gz','w:gz') as tar:
            for root in [Path('release-verify.log'),Path('release-input.json'),Path('.debug'),Path('test-results')]:
              if root.exists():tar.add(root)
          PYFILES
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lifecycle-full-release-${{ github.run_id }}
          path: release-evidence.tar.gz
  controlled-ready:
    needs: native-assets
    strategy:
      fail-fast: false
      matrix: {timing: [before, during, after, none]}
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    env:
      DSC_READY_TIMING: ${{ matrix.timing }}
      DEV_SESSION_CANVAS_SMOKE_SCENARIO_FILTER: restricted
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0, ref: f8d9ad5341f8a20a7cbd97fda6beb01e71937ddc}
      - name: Extract finite original-ready control
        run: git fetch origin "${{ github.sha }}" && git show "${{ github.sha }}:lifecycle-ready-control.py" > lifecycle-ready-control.py
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm}
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          pattern: execution-native-*-${{ github.run_id }}
          merge-multiple: true
          path: archives
      - run: |
          node scripts/build/assemble-execution-distribution-assets.mjs --source archives --output platform --input-sha f8d9ad5341f8a20a7cbd97fda6beb01e71937ddc
          echo "DEV_SESSION_CANVAS_EXECUTION_ASSETS_SET=$GITHUB_WORKSPACE/platform" >> "$GITHUB_ENV"
      - run: python3 lifecycle-ready-control.py
      - name: Verify original ready timing and full restricted assertions
        run: |
          set +e
          timeout --signal=TERM --kill-after=20s 240s npm run test:smoke > controlled.log 2>&1
          code=$?
          echo "$code" > controlled.exit
          python3 - <<'PYCHECK'
          from pathlib import Path
          import os,json
          mode=os.environ['DSC_READY_TIMING']; code=int(Path('controlled.exit').read_text()); log=Path('controlled.log').read_text()
          gates=[json.loads(line.split('[lifecycle-control] ',1)[1]) for line in log.splitlines() if '[lifecycle-control] ' in line]
          after=next(x for x in gates if x['stage']=='after-diagnostic')
          assert after['ready']==(mode!='none')
          if mode=='none':
            assert code==1 and 'Timed out waiting for the editor Canvas to become ready (20000ms).' in log
            assert not any(x['stage']=='real-bootstrap-ack' for x in gates)
          else:
            assert code==0 and 'Restricted workspace smoke passed.' in log
            ack=next(x for x in gates if x['stage']=='real-bootstrap-ack')
            assert ack['lifecycle']['bootstrapAck']
            if mode=='during':
              during=next(x for x in gates if x['stage']=='original-ready-delivered-during')
              assert during['fakeActive']=='panel' and during['realActive']=='editor' and during['ready']
          Path('control-result.json').write_text(json.dumps({'mode':mode,'smoke_exit':code,'assertions':'passed','gates':gates},indent=2)+'\n')
          print(json.dumps({'mode':mode,'smoke_exit':code,'assertions':'passed'}))
          PYCHECK
      - name: Collect original control evidence
        if: always()
        run: |
          python3 - <<'PYFILES'
          from pathlib import Path
          import tarfile
          with tarfile.open('controlled-evidence.tar.gz','w:gz') as tar:
            for root in [Path('controlled.log'),Path('controlled.exit'),Path('control-inputs.json'),Path('control-result.json'),Path('.debug/vscode-smoke/restricted/artifacts'),Path('.debug/vscode-smoke/restricted/user-data/logs')]:
              if root.exists():tar.add(root)
          PYFILES
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lifecycle-controlled-${{ matrix.timing }}-${{ github.run_id }}
          path: controlled-evidence.tar.gz
