name: Temporary Packaged Trusted Verification
on:
  push:
    branches: [smoke-lifecycle-release-ci-temp]
    paths: [.github/workflows/smoke-packaged-trusted-ci-temp.yml]
permissions: {contents: read, actions: read}
jobs:
  packaged-trusted:
    strategy:
      fail-fast: false
      matrix: {sample: [1]}
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0, ref: f8d9ad5341f8a20a7cbd97fda6beb01e71937ddc}
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm}
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 38681093813
          pattern: execution-native-*-38681093813
          merge-multiple: true
          path: archives
      - run: |
          node scripts/build/assemble-execution-distribution-assets.mjs --source archives --output platform --input-sha f8d9ad5341f8a20a7cbd97fda6beb01e71937ddc
          echo "DEV_SESSION_CANVAS_EXECUTION_ASSETS_SET=$GITHUB_WORKSPACE/platform" >> "$GITHUB_ENV"
      - name: Bounded original packaged trusted scenario
        env:
          DEV_SESSION_CANVAS_SMOKE_SCENARIO_FILTER: trusted
        run: |
          set +e
          timeout --signal=TERM --kill-after=20s 300s npm run test:vsix-smoke > packaged.log 2>&1
          code=$?
          echo "$code" > packaged.exit
          exit "$code"
      - name: Preserve probe and original logs
        if: always()
        run: |
          python3 - <<'PYFILES'
          from pathlib import Path
          import tarfile
          with tarfile.open('packaged-evidence.tar.gz','w:gz') as tar:
            for root in [Path('packaged.log'),Path('packaged.exit'),Path('.debug/vscode-vsix-smoke/smoke-runtime/artifacts'),Path('.debug/vscode-vsix-smoke/smoke-runtime/user-data/logs')]:
              if root.exists():tar.add(root)
          PYFILES
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: 'packaged-trusted-${{ github.run_id }}', path: packaged-evidence.tar.gz}
