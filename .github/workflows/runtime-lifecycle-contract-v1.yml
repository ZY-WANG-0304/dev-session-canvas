name: Runtime Lifecycle Contract V1

on:
  workflow_dispatch:
  push:
    branches: [runtime-exit-integrity-native-candidates]
    paths:
      - .github/workflows/runtime-lifecycle-contract-v1.yml
      - scripts/diagnostics/runtime-provider-lifecycle-model-v1.mjs
      - scripts/diagnostics/diagnose-runtime-provider-lifecycle-v1.mjs
      - scripts/diagnostics/diagnostic-process-guard-v2.mjs
      - scripts/diagnostics/diagnose-process-guard-v2.mjs

permissions:
  contents: read

concurrency:
  group: runtime-lifecycle-contract-v1-${{ github.ref }}
  cancel-in-progress: false

jobs:
  lifecycle-contract:
    name: Lifecycle model and process guard / ${{ matrix.os }} / Node 22.23.2
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.2'
      - name: Record runner and exact inputs
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import os from 'node:os';
          import crypto from 'node:crypto';
          import { execFileSync } from 'node:child_process';
          fs.mkdirSync('lifecycle-runner-evidence');
          const files = [
            '.github/workflows/runtime-lifecycle-contract-v1.yml',
            'scripts/diagnostics/runtime-provider-lifecycle-model-v1.mjs',
            'scripts/diagnostics/diagnose-runtime-provider-lifecycle-v1.mjs',
            'scripts/diagnostics/diagnostic-process-guard-v2.mjs',
            'scripts/diagnostics/diagnose-process-guard-v2.mjs',
            'docs/design-docs/runtime-execution-lifecycle-contract.md',
          ];
          const sources = files.map(path => {
            const bytes = fs.readFileSync(path);
            const destination = `lifecycle-runner-evidence/inputs/${path}`;
            fs.mkdirSync(destination.slice(0, destination.lastIndexOf('/')), { recursive: true });
            fs.writeFileSync(destination, bytes, { flag: 'wx' });
            return { path, sha256: crypto.createHash('sha256').update(bytes).digest('hex') };
          });
          const metadata = {
            schema: 'runtime-lifecycle-runner-v1',
            commit: execFileSync('git', ['rev-parse', 'HEAD'], { encoding: 'utf8' }).trim(),
            githubSha: process.env.GITHUB_SHA,
            githubRef: process.env.GITHUB_REF,
            runId: process.env.GITHUB_RUN_ID,
            attempt: process.env.GITHUB_RUN_ATTEMPT,
            runnerOs: process.env.RUNNER_OS,
            runnerArch: process.env.RUNNER_ARCH,
            image: process.env.ImageOS,
            imageVersion: process.env.ImageVersion,
            platform: process.platform,
            arch: process.arch,
            osRelease: os.release(),
            osVersion: os.version(),
            versions: process.versions,
            executable: process.execPath,
            sources,
          };
          fs.writeFileSync('lifecycle-runner-evidence/environment.json', JSON.stringify(metadata, null, 2) + '\n', { flag: 'wx' });
          if (process.versions.node !== '22.23.2' || metadata.commit !== metadata.githubSha) {
            throw new Error('Runner input mismatch');
          }
          NODE
      - name: Check diagnostic syntax
        run: |
          node --check scripts/diagnostics/runtime-provider-lifecycle-model-v1.mjs
          node --check scripts/diagnostics/diagnose-runtime-provider-lifecycle-v1.mjs
          node --check scripts/diagnostics/diagnostic-process-guard-v2.mjs
          node --check scripts/diagnostics/diagnose-process-guard-v2.mjs
      - name: Check D1 model and evidence negatives
        if: ${{ !cancelled() }}
        env:
          DSC_PROVIDER_LIFECYCLE_SELFTEST_EVIDENCE: provider-lifecycle-selftest
        run: node scripts/diagnostics/diagnose-runtime-provider-lifecycle-v1.mjs --self-test 2>&1 | tee lifecycle-d1-selftest.log
      - name: Run complete D1 schedule
        if: ${{ !cancelled() }}
        run: node scripts/diagnostics/diagnose-runtime-provider-lifecycle-v1.mjs --output provider-lifecycle-evidence
      - name: Verify every saved D1 case
        if: always()
        run: node scripts/diagnostics/diagnose-runtime-provider-lifecycle-v1.mjs --verify-saved provider-lifecycle-evidence
      - name: Check D2 process guard and evidence negatives
        if: ${{ !cancelled() }}
        env:
          DSC_PROCESS_GUARD_SELFTEST_EVIDENCE: process-guard-selftest
        run: node scripts/diagnostics/diagnose-process-guard-v2.mjs --self-test 2>&1 | tee lifecycle-d2-selftest.log
      - name: Run complete D2 schedule including expected failures
        if: ${{ !cancelled() }}
        run: node scripts/diagnostics/diagnose-process-guard-v2.mjs --output process-guard-evidence
      - name: Verify every saved D2 case
        if: always()
        run: node scripts/diagnostics/diagnose-process-guard-v2.mjs --verify-saved process-guard-evidence
      - name: Upload complete evidence including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runtime-lifecycle-contract-v1-${{ matrix.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            lifecycle-runner-evidence/
            provider-lifecycle-evidence/
            provider-lifecycle-selftest/
            process-guard-evidence/
            process-guard-selftest/
            lifecycle-d1-selftest.log
            lifecycle-d2-selftest.log
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14
