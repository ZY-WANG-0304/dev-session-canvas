name: Temporary Formal Input Checkpoint Validation
on:
  push:
    branches: [release-checkpoint-after334-temp]
    paths: [.github/workflows/release-checkpoint-after334-temp.yml]
permissions:
  contents: read
  actions: read
jobs:
  checkpoint:
    runs-on: ubuntu-22.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 9198cacbee91fc170b82578e353c16a27f3574b8
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 38665513172
          pattern: execution-native-*-38665513172
          merge-multiple: true
          path: archives
      - name: Assemble exact formal-input assets
        run: |
          node scripts/build/assemble-execution-distribution-assets.mjs --source archives --output platform --input-sha 9198cacbee91fc170b82578e353c16a27f3574b8
          echo "DEV_SESSION_CANVAS_EXECUTION_ASSETS_SET=$GITHUB_WORKSPACE/platform" >> "$GITHUB_ENV"
      - name: Bounded original checkpoint validation
        env:
          DEV_SESSION_CANVAS_SMOKE_SCENARIO_FILTER: runtime-checkpoint-refresh
        run: |
          set +e
          timeout --signal=TERM --kill-after=20s 420s npm run test:smoke > checkpoint.log 2>&1
          status=$?
          echo "$status" > checkpoint.exit
          tail -n 12 checkpoint.log
          exit "$status"
      - name: Preserve finite checkpoint evidence
        if: always()
        run: |
          tar -czf checkpoint-evidence.tar.gz --ignore-failed-read checkpoint.log checkpoint.exit .debug/vscode-smoke/runtime-checkpoint-refresh/artifacts .debug/vscode-smoke/runtime-checkpoint-refresh/user-data/logs .debug/vscode-smoke/runtime-checkpoint-refresh/smoke-host/dist/extension.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: formal-checkpoint-${{ github.run_id }}
          path: checkpoint-evidence.tar.gz
