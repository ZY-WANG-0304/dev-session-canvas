name: Windows Real Agent Execution Acceptance

on:
  workflow_dispatch:
  workflow_call:
    secrets:
      DEEPSEEK_API_KEY:
        required: true

permissions:
  contents: read

concurrency:
  group: runtime-real-agent-acceptance
  cancel-in-progress: false

jobs:
  real-agent-windows:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - name: Checkout acceptance source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Setup fixed Agent Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '25.6.0'
          cache: npm
      - name: Setup x64 compiler environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Check real Agent workflow contract
        run: |
          node scripts/test/test-agent-candidate-deepseek.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/test/test-agent-candidate-ci-report.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/test/test-runtime-agent-ci-workflow.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/test/test-agent-candidate-process-observer.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/test/test-agent-candidate-windows-observer.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/test/test-agent-candidate-cli.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Install fixed real Agent CLIs
        run: npm install --global --no-audit --no-fund @openai/codex@0.157.1 @anthropic-ai/claude-code@2.1.280
      - name: Prepare fixed VS Code
        run: |
          @'
          import fs from 'node:fs/promises';
          import path from 'node:path';
          import { downloadAndUnzipVSCode } from '@vscode/test-electron';
          const executable = await downloadAndUnzipVSCode({ version: '1.117.0', platform: 'win32-x64-archive',
            cachePath: path.join(process.env.RUNNER_TEMP, 'agent-vscode') });
          await fs.appendFile(process.env.GITHUB_ENV, `DEV_SESSION_CANVAS_VSCODE_EXECUTABLE=${executable}\n`);
          '@ | node --input-type=module
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build fixed Electron execution candidate
        shell: pwsh
        run: |
          $headers = Join-Path $env:RUNNER_TEMP 'agent-electron-headers.tar.gz'
          $nodeLib = Join-Path $env:RUNNER_TEMP 'agent-electron-node.lib'
          Invoke-WebRequest https://artifacts.electronjs.org/headers/dist/v39.8.7/node-v39.8.7-headers.tar.gz -OutFile $headers
          Invoke-WebRequest https://artifacts.electronjs.org/headers/dist/v39.8.7/win-x64/node.lib -OutFile $nodeLib
          if ((Get-FileHash $headers -Algorithm SHA256).Hash.ToLowerInvariant() -ne 'af6712ab16c436b9288ece2f0173924c74008446346bda3457d07b769f402eda') { throw 'Electron headers hash mismatch' }
          if ((Get-FileHash $nodeLib -Algorithm SHA256).Hash.ToLowerInvariant() -ne 'ee92beea67d0f12ef058adc52d0f5344e1005153c9487d0f4d63cab91111421a') { throw 'Electron import library hash mismatch' }
          $include = Join-Path $env:RUNNER_TEMP 'agent-electron-headers'
          $assets = Join-Path $env:RUNNER_TEMP 'agent-native-assets'
          New-Item -ItemType Directory -Path $include | Out-Null
          tar --extract --gzip --file $headers --strip-components=1 --directory $include
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          @'
          import assert from 'node:assert/strict';
          import { spawnSync } from 'node:child_process';
          import path from 'node:path';
          function run(args) {
            const result = spawnSync(process.env.DEV_SESSION_CANVAS_VSCODE_EXECUTABLE, args, {
              stdio: 'inherit', env: { ...process.env, ELECTRON_RUN_AS_NODE: '1' }
            });
            if (result.error) throw result.error;
            assert.equal(result.signal, null);
            assert.equal(result.status, 0);
          }
          run(['-e', 'const assert = require("node:assert/strict"); assert.equal(process.versions.electron, "39.8.7"); assert.equal(process.versions.node, "22.22.1"); assert.equal(process.versions.modules, "140");']);
          run(['scripts/build/windows-execution-candidate-assets.mjs', 'build',
            '--output', path.join(process.env.RUNNER_TEMP, 'agent-native-assets'),
            '--dependency-root', path.join(process.env.GITHUB_WORKSPACE, 'node_modules'),
            '--headers', path.join(process.env.RUNNER_TEMP, 'agent-electron-headers', 'include', 'node'),
            '--node-lib', path.join(process.env.RUNNER_TEMP, 'agent-electron-node.lib'),
            '--delay-load-hook', path.join(path.dirname(process.execPath), 'node_modules/npm/node_modules/node-gyp/src/win_delay_load_hook.cc')]);
          '@ | node --input-type=module
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/build/build.mjs --execution-profile=windows-owner-v1-candidate --execution-assets $assets
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Run finite real Agent acceptance
        id: real_agents
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          $output = Join-Path $env:RUNNER_TEMP 'dsc-agent'
          $log = Join-Path $env:RUNNER_TEMP 'agent-candidate.log'
          node scripts/smoke/run-vscode-agent-candidate.mjs --backend=deepseek --ci-report agent-ci-report --output $output *> $log
          if ($LASTEXITCODE -ne 0) {
            Write-Error 'Real Agent acceptance failed; sanitized report: agent-ci-report/'
            exit 1
          }
          Write-Output 'Real Agent acceptance passed; sanitized report: agent-ci-report/'
      - name: Upload sanitized real Agent report
        if: always() && steps.real_agents.outputs.report_ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: runtime-real-agent-windows-${{ github.run_id }}-${{ github.run_attempt }}
          path: agent-ci-report/
          if-no-files-found: error
          retention-days: 14
