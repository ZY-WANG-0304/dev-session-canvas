name: CI Validation
'on':
  workflow_call:
    secrets:
      DEEPSEEK_API_KEY:
        required: false
    inputs:
      input_sha:
        required: true
        type: string
      base_sha:
        required: true
        type: string
      head_sha:
        required: true
        type: string
      mode:
        required: true
        type: string
      version:
        required: false
        type: string
        default: ''
      trigger_tag:
        required: false
        type: string
        default: ''
    outputs:
      input_sha:
        value: ${{ jobs.resolve.outputs.input_sha }}
      plan_digest:
        value: ${{ jobs.resolve.outputs.plan_digest }}
      accepted:
        value: ${{ jobs.verify-result.outputs.accepted }}
permissions:
  contents: read
  actions: read
jobs:
  resolve:
    name: Gate resolve (default)
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    outputs:
      mode: ${{ steps.plan.outputs.mode }}
      version: ${{ steps.plan.outputs.version }}
      input_sha: ${{ steps.plan.outputs.input_sha }}
      functional: ${{ steps.plan.outputs.functional }}
      artifact: ${{ steps.plan.outputs.artifact }}
      plan_digest: ${{ steps.plan.outputs.plan_digest }}
      input_contract: ${{ steps.plan.outputs.input_contract }}
      regression: ${{ steps.plan.outputs.regression }}
      frontend_build: ${{ steps.plan.outputs.frontend_build }}
      webview_function: ${{ steps.plan.outputs.webview_function }}
      webview_visual: ${{ steps.plan.outputs.webview_visual }}
      marketplace_browser: ${{ steps.plan.outputs.marketplace_browser }}
      native_assets: ${{ steps.plan.outputs.native_assets }}
      source_build: ${{ steps.plan.outputs.source_build }}
      source_host: ${{ steps.plan.outputs.source_host }}
      marketplace_host: ${{ steps.plan.outputs.marketplace_host }}
      package_clean: ${{ steps.plan.outputs.package_clean }}
      packaged_host: ${{ steps.plan.outputs.packaged_host }}
      installed_pair: ${{ steps.plan.outputs.installed_pair }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
    - name: Checkout fixed input
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        persist-credentials: false
        ref: ${{ inputs.input_sha }}
    - name: Setup fixed Node
      uses: actions/setup-node@v4
      with:
        node-version: 22.23.3
        architecture: x64
    - name: Bind local product validation ref
      if: ${{ inputs.mode == 'release-tag' && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' }}
      shell: bash
      env:
        PRODUCT_SHA: ${{ inputs.input_sha }}
        PRODUCT_TAG: ${{ inputs.trigger_tag }}
      run: |-
        set -euo pipefail
        [[ "$PRODUCT_SHA" =~ ^[a-f0-9]{40}$ ]]
        [[ "$PRODUCT_TAG" =~ ^publish/v[0-9]+\.[0-9]+\.[0-9]+$ ]]
        git merge-base --is-ancestor "$PRODUCT_SHA" origin/main
        if git show-ref --verify --quiet "refs/tags/$PRODUCT_TAG"; then
          [[ "$(git rev-parse "$PRODUCT_TAG^{commit}")" == "$PRODUCT_SHA" ]]
        else
          git update-ref "refs/tags/$PRODUCT_TAG" "$PRODUCT_SHA" ""
        fi
    - name: Resolve immutable plan
      id: plan
      shell: bash
      env:
        GATE_MODE: ${{ inputs.mode }}
        GATE_BASE: ${{ inputs.base_sha }}
        GATE_HEAD: ${{ inputs.head_sha }}
        GATE_SHA: ${{ inputs.input_sha }}
        GATE_VERSION: ${{ inputs.version }}
        GATE_TRIGGER_TAG: ${{ inputs.trigger_tag }}
      run: |-
        set -euo pipefail
        run_head="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --jq .head_sha)"
        args=(--mode "$GATE_MODE" --sha "$GATE_SHA" --base "$GATE_BASE" --head "$GATE_HEAD" --run-head "$run_head" --output gate-plan/gate-plan.json)
        if [[ -n "$GATE_VERSION" ]]; then args+=(--version "$GATE_VERSION"); fi
        if [[ -n "$GATE_TRIGGER_TAG" ]]; then args+=(--trigger-tag "$GATE_TRIGGER_TAG"); fi
        node scripts/gates/resolve-plan.mjs "${args[@]}"
    - name: Upload plan input
      if: ${{ success() }}
      uses: actions/upload-artifact@v4
      with:
        name: gate-transfer-plan-${{ github.run_id }}-${{ github.run_attempt }}
        path: gate-plan
        include-hidden-files: true
        if-no-files-found: error
        retention-days: ${{ inputs.mode == 'release-tag' && 90 || 14 }}
  input-contract:
    name: Gate input-contract (${{ matrix.variant }})
    needs:
    - resolve
    if: ${{ always() && needs.resolve.result == 'success' }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.resolve.outputs.input_contract) }}
    env:
      DEV_SESSION_CANVAS_GATE_PLAN: gate-plan/gate-plan.json
    steps:
    - name: Checkout fixed input
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        persist-credentials: false
        ref: ${{ inputs.input_sha }}
    - name: Setup fixed Node
      uses: actions/setup-node@v4
      with:
        node-version: 22.23.3
        architecture: x64
        cache: npm
        cache-dependency-path: package-lock.json
    - name: Configure isolated runner caches
      run: node scripts/gates/setup-environment.mjs
    - name: Download frozen plan
      uses: actions/download-artifact@v4
      with:
        name: gate-transfer-plan-${{ github.run_id }}-${{ github.run_attempt }}
        path: gate-plan
    - name: Install locked dependencies
      run: node scripts/gates/run-infrastructure.mjs --kind install --profile ${{ matrix.dependencyProfile }} --output gate-results -- npm ci --no-audit --no-fund
      timeout-minutes: 10
    - name: Execute planned stage
      run: node scripts/gates/run-stage.mjs --plan gate-plan/gate-plan.json --job input-contract --variant "${{ matrix.variant }}" --output gate-results
    - name: Collect bounded stage evidence
      if: ${{ always() }}
      run: node scripts/gates/evidence.mjs --plan gate-plan/gate-plan.json --job input-contract --variant "${{ matrix.variant }}" --output gate-artifacts/input-contract/${{ matrix.variant }}
      timeout-minutes: 1
    - name: Preserve stage evidence
      if: ${{ always() }}
      uses: actions/upload-artifact@v4
      with:
        name: gate-input-contract-${{ matrix.variant }}-${{ github.run_id }}-${{ github.run_attempt }}
        path: gate-artifacts/input-contract/${{ matrix.variant }}
        include-hidden-files: true
        if-no-files-found: error
        retention-days: ${{ inputs.mode == 'release-tag' && 90 || 14 }}
  regression:
    name: Gate regression (${{ matrix.variant }})
    needs:
    - resolve
    if: ${{ always() && needs.resolve.result == 'success' }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.resolve.outputs.regression) }}
    env:
      DEV_SESSION_CANVAS_GATE_PLAN: gate-plan/gate-plan.json
    steps:
    - name: Checkout fixed input
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        persist-credentials: false
        ref: ${{ inputs.input_sha }}
    - name: Setup fixed Node
      uses: actions/setup-node@v4
      with:
        node-version: 22.23.3
        architecture: x64
        cache: npm
        cache-dependency-path: package-lock.json
    - name: Configure isolated runner caches
      run: node scripts/gates/setup-environment.mjs
    - name: Restore fixed Chromium cache
      uses: actions/cache@v4
      with:
        path: ${{ env.PLAYWRIGHT_BROWSERS_PATH }}
        key: dsc-chromium-v1-${{ runner.os }}-${{ runner.arch }}-${{ matrix.runner }}-${{ hashFiles('package-lock.json') }}
      timeout-minutes: 5
    - name: Download frozen plan
      uses: actions/download-artifact@v4
      with:
        name: gate-transfer-plan-${{ github.run_id }}-${{ github.run_attempt }}
        path: gate-plan
    - name: Install locked dependencies
      run: node scripts/gates/run-infrastructure.mjs --kind install --profile ${{ matrix.dependencyProfile }} --output gate-results -- npm ci --no-audit --no-fund
      timeout-minutes: 10
    - name: Install declared regression browser dependency
      run: node scripts/gates/run-infrastructure.mjs --kind download --output gate-results -- node node_modules/playwright/cli.js install chromium
      timeout-minutes: 5
    - name: Execute planned stage
      run: node scripts/gates/run-stage.mjs --plan gate-plan/gate-plan.json --job regression --variant "${{ matrix.variant }}" --output gate-results
    - name: Collect bounded stage evidence
      if: ${{ always() }}
      run: node scripts/gates/evidence.mjs --plan gate-plan/gate-plan.json --job regression --variant "${{ matrix.variant }}" --output gate-artifacts/regression/${{ matrix.variant }}
      timeout-minutes: 1
    - name: Preserve stage evidence
      if: ${{ always() }}
      uses: actions/upload-artifact@v4
      with:
        name: gate-regression-${{ matrix.variant }}-${{ github.run_id }}-${{ github.run_attempt }}
        path: gate-artifacts/regression/${{ matrix.variant }}
        include-hidden-files: true
        if-no-files-found: error
        retention-days: ${{ inputs.mode == 'release-tag' && 90 || 14 }}
  frontend-build:
    name: Gate frontend-build (${{ matrix.variant }})
    needs:
    - resolve
    if: ${{ always() && needs.resolve.result == 'success' }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.resolve.outputs.frontend_build) }}
    env:
      DEV_SESSION_CANVAS_GATE_PLAN: gate-plan/gate-plan.json
    steps:
    - name: Checkout fixed input
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        persist-credentials: false
        ref: ${{ inputs.input_sha }}
    - name: Setup fixed Node
      uses: actions/setup-node@v4
      with:
        node-version: 22.23.3
        architecture: x64
        cache: npm
        cache-dependency-path: package-lock.json
    - name: Configure isolated runner caches
      run: node scripts/gates/setup-environment.mjs
    - name: Download frozen plan
      uses: actions/download-artifact@v4
      with:
        name: gate-transfer-plan-${{ github.run_id }}-${{ github.run_attempt }}
        path: gate-plan
    - name: Install locked dependencies
      run: node scripts/gates/run-infrastructure.mjs --kind install --profile ${{ matrix.dependencyProfile }} --output gate-results -- npm ci --no-audit --no-fund
      timeout-minutes: 10
    - name: Execute planned stage
      run: node scripts/gates/run-stage.mjs --plan gate-plan/gate-plan.json --job frontend-build --variant "${{ matrix.variant }}" --output gate-results
    - name: Upload browser input
      if: ${{ success() }}
      uses: actions/upload-artifact@v4
      with:
        name: gate-transfer-browser-${{ github.run_id }}-${{ github.run_attempt }}
        path: gate-transfer/browser-bundle
        include-hidden-files: true
        if-no-files-found: error
        retention-days: ${{ inputs.mode == 'release-tag' && 90 || 14 }}
    - name: Collect bounded stage evidence
      if: ${{ always() }}
      run: node scripts/gates/evidence.mjs --plan gate-plan/gate-plan.json --job frontend-build --variant "${{ matrix.variant }}" --output gate-artifacts/frontend-build/${{ matrix.variant }}
      timeout-minutes: 1
    - name: Preserve stage evidence
      if: ${{ always() }}
      uses: actions/upload-artifact@v4
      with:
        name: gate-frontend-build-${{ matrix.variant }}-${{ github.run_id }}-${{ github.run_attempt }}
        path: gate-artifacts/frontend-build/${{ matrix.variant }}
        include-hidden-files: true
        if-no-files-found: error
        retention-days: ${{ inputs.mode == 'release-tag' && 90 || 14 }}
  webview-function:
    name: Gate webview-function (${{ matrix.variant }})
    needs:
    - resolve
    - frontend-build
    if: ${{ always() && needs.resolve.result == 'success' && needs.frontend-build.result == 'success' }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.resolve.outputs.webview_function) }}
    env:
      DEV_SESSION_CANVAS_GATE_PLAN: gate-plan/gate-plan.json
    steps:
    - name: Checkout fixed input
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        persist-credentials: false
        ref: ${{ inputs.input_sha }}
    - name: Setup fixed Node
      uses: actions/setup-node@v4
      with:
        node-version: 22.23.3
        architecture: x64
        cache: npm
        cache-dependency-path: package-lock.json
    - name: Configure isolated runner caches
      run: node scripts/gates/setup-environment.mjs
    - name: Restore fixed Chromium cache
      uses: actions/cache@v4
      with:
        path: ${{ env.PLAYWRIGHT_BROWSERS_PATH }}
        key: dsc-chromium-v1-${{ runner.os }}-${{ runner.arch }}-${{ matrix.runner }}-${{ hashFiles('package-lock.json') }}
      timeout-minutes: 5
    - name: Download frozen plan
      uses: actions/download-artifact@v4
      with:
        name: gate-transfer-plan-${{ github.run_id }}-${{ github.run_attempt }}
        path: gate-plan
    - name: Install locked dependencies
      run: node scripts/gates/run-infrastructure.mjs --kind install --profile ${{ matrix.dependencyProfile }} --output gate-results -- npm ci --no-audit --no-fund
      timeout-minutes: 10
    - name: Install fixed browser dependencies
      if: ${{ runner.os == 'Linux' }}
      shell: bash
      run: node scripts/gates/browser-system-dependencies.mjs
      timeout-minutes: 5
    - name: Install locked Chromium
      run: node scripts/gates/run-infrastructure.mjs --kind download --output gate-results -- node node_modules/playwright/cli.js install chromium
      timeout-minutes: 5
    - name: Download original browser bundle
      uses: actions/download-artifact@v4
      with:
        name: gate-transfer-browser-${{ github.run_id }}-${{ github.run_attempt }}
        path: gate-input/browser
    - name: Execute planned stage
      run: node scripts/gates/run-stage.mjs --plan gate-plan/gate-plan.json --job webview-function --variant "${{ matrix.variant }}" --output gate-results --browser-input gate-input/browser
    - name: Collect bounded stage evidence
      if: ${{ always() }}
      run: node scripts/gates/evidence.mjs --plan gate-plan/gate-plan.json --job webview-function --variant "${{ matrix.variant }}" --output gate-artifacts/webview-function/${{ matrix.variant }}
      timeout-minutes: 1
    - name: Preserve stage evidence
      if: ${{ always() }}
      uses: actions/upload-artifact@v4
      with:
        name: gate-webview-function-${{ matrix.variant }}-${{ github.run_id }}-${{ github.run_attempt }}
        path: gate-artifacts/webview-function/${{ matrix.variant }}
        include-hidden-files: true
        if-no-files-found: error
        retention-days: ${{ inputs.mode == 'release-tag' && 90 || 14 }}
  webview-visual:
    name: Gate webview-visual (${{ matrix.variant }})
    needs:
    - resolve
    - frontend-build
    if: ${{ always() && needs.resolve.result == 'success' && needs.frontend-build.result == 'success' }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.resolve.outputs.webview_visual) }}
    env:
      DEV_SESSION_CANVAS_GATE_PLAN: gate-plan/gate-plan.json
    steps:
    - name: Checkout fixed input
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        persist-credentials: false
        ref: ${{ inputs.input_sha }}
    - name: Setup fixed Node
      uses: actions/setup-node@v4
      with:
        node-version: 22.23.3
        architecture: x64
        cache: npm
        cache-dependency-path: package-lock.json
    - name: Configure isolated runner caches
      run: node scripts/gates/setup-environment.mjs
    - name: Restore fixed Chromium cache
      uses: actions/cache@v4
      with:
        path: ${{ env.PLAYWRIGHT_BROWSERS_PATH }}
        key: dsc-chromium-v1-${{ runner.os }}-${{ runner.arch }}-${{ matrix.runner }}-${{ hashFiles('package-lock.json') }}
      timeout-minutes: 5
    - name: Download frozen plan
      uses: actions/download-artifact@v4
      with:
        name: gate-transfer-plan-${{ github.run_id }}-${{ github.run_attempt }}
        path: gate-plan
    - name: Install locked dependencies
      run: node scripts/gates/run-infrastructure.mjs --kind install --profile ${{ matrix.dependencyProfile }} --output gate-results -- npm ci --no-audit --no-fund
      timeout-minutes: 10
    - name: Install fixed browser dependencies
      if: ${{ runner.os == 'Linux' }}
      shell: bash
      run: node scripts/gates/browser-system-dependencies.mjs
      timeout-minutes: 5
    - name: Install locked Chromium
      run: node scripts/gates/run-infrastructure.mjs --kind download --output gate-results -- node node_modules/playwright/cli.js install chromium
      timeout-minutes: 5
    - name: Download original browser bundle
      uses: actions/download-artifact@v4
      with:
        name: gate-transfer-browser-${{ github.run_id }}-${{ github.run_attempt }}
        path: gate-input/browser
    - name: Execute planned stage
      run: node scripts/gates/run-stage.mjs --plan gate-plan/gate-plan.json --job webview-visual --variant "${{ matrix.variant }}" --output gate-results --browser-input gate-input/browser
    - name: Collect bounded stage evidence
      if: ${{ always() }}
      run: node scripts/gates/evidence.mjs --plan gate-plan/gate-plan.json --job webview-visual --variant "${{ matrix.variant }}" --output gate-artifacts/webview-visual/${{ matrix.variant }}
      timeout-minutes: 1
    - name: Preserve stage evidence
      if: ${{ always() }}
      uses: actions/upload-artifact@v4
      with:
        name: gate-webview-visual-${{ matrix.variant }}-${{ github.run_id }}-${{ github.run_attempt }}
        path: gate-artifacts/webview-visual/${{ matrix.variant }}
        include-hidden-files: true
        if-no-files-found: error
        retention-days: ${{ inputs.mode == 'release-tag' && 90 || 14 }}
  marketplace-browser:
    name: Gate marketplace-browser (${{ matrix.variant }})
    needs:
    - resolve
    - frontend-build
    if: ${{ always() && needs.resolve.result == 'success' && needs.frontend-build.result == 'success' }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.resolve.outputs.marketplace_browser) }}
    env:
      DEV_SESSION_CANVAS_GATE_PLAN: gate-plan/gate-plan.json
    steps:
    - name: Checkout fixed input
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        persist-credentials: false
        ref: ${{ inputs.input_sha }}
    - name: Setup fixed Node
      uses: actions/setup-node@v4
      with:
        node-version: 22.23.3
        architecture: x64
        cache: npm
        cache-dependency-path: package-lock.json
    - name: Configure isolated runner caches
      run: node scripts/gates/setup-environment.mjs
    - name: Restore fixed Chromium cache
      uses: actions/cache@v4
      with:
        path: ${{ env.PLAYWRIGHT_BROWSERS_PATH }}
        key: dsc-chromium-v1-${{ runner.os }}-${{ runner.arch }}-${{ matrix.runner }}-${{ hashFiles('package-lock.json') }}
      timeout-minutes: 5
    - name: Download frozen plan
      uses: actions/download-artifact@v4
      with:
        name: gate-transfer-plan-${{ github.run_id }}-${{ github.run_attempt }}
        path: gate-plan
    - name: Install locked dependencies
      run: node scripts/gates/run-infrastructure.mjs --kind install --profile ${{ matrix.dependencyProfile }} --output gate-results -- npm ci --no-audit --no-fund
      timeout-minutes: 10
    - name: Install fixed browser dependencies
      if: ${{ runner.os == 'Linux' }}
      shell: bash
      run: node scripts/gates/browser-system-dependencies.mjs
      timeout-minutes: 5
    - name: Install locked Chromium
      run: node scripts/gates/run-infrastructure.mjs --kind download --output gate-results -- node node_modules/playwright/cli.js install chromium
      timeout-minutes: 5
    - name: Download original browser bundle
      uses: actions/download-artifact@v4
      with:
        name: gate-transfer-browser-${{ github.run_id }}-${{ github.run_attempt }}
        path: gate-input/browser
    - name: Execute planned stage
      run: node scripts/gates/run-stage.mjs --plan gate-plan/gate-plan.json --job marketplace-browser --variant "${{ matrix.variant }}" --output gate-results --browser-input gate-input/browser
    - name: Collect bounded stage evidence
      if: ${{ always() }}
      run: node scripts/gates/evidence.mjs --plan gate-plan/gate-plan.json --job marketplace-browser --variant "${{ matrix.variant }}" --output gate-artifacts/marketplace-browser/${{ matrix.variant }}
      timeout-minutes: 1
    - name: Preserve stage evidence
      if: ${{ always() }}
      uses: actions/upload-artifact@v4
      with:
        name: gate-marketplace-browser-${{ matrix.variant }}-${{ github.run_id }}-${{ github.run_attempt }}
        path: gate-artifacts/marketplace-browser/${{ matrix.variant }}
        include-hidden-files: true
        if-no-files-found: error
        retention-days: ${{ inputs.mode == 'release-tag' && 90 || 14 }}
  native-assets:
    name: Gate native-assets (${{ matrix.variant }})
    needs:
    - resolve
    - input-contract
    if: ${{ always() && needs.resolve.result == 'success' && needs.resolve.outputs.functional == 'true' && needs.input-contract.result == 'success' }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.resolve.outputs.native_assets) }}
    env:
      DEV_SESSION_CANVAS_GATE_PLAN: gate-plan/gate-plan.json
      DEV_SESSION_CANVAS_EXECUTION_INPUT_SHA: ${{ inputs.input_sha }}
    steps:
    - name: Preserve source bytes on Windows
      if: ${{ runner.os == 'Windows' }}
      shell: pwsh
      run: git config --global core.autocrlf false
    - name: Checkout fixed input
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        persist-credentials: false
        ref: ${{ inputs.input_sha }}
    - name: Setup target compiler
      if: ${{ runner.os == 'Windows' }}
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: ${{ matrix.compilerArch }}
    - name: Setup fixed Node
      uses: actions/setup-node@v4
      with:
        node-version: 25.6.0
        architecture: ${{ matrix.arch }}
        cache: npm
        cache-dependency-path: package-lock.json
    - name: Configure isolated runner caches
      run: node scripts/gates/setup-environment.mjs
    - name: Download frozen plan
      uses: actions/download-artifact@v4
      with:
        name: gate-transfer-plan-${{ github.run_id }}-${{ github.run_attempt }}
        path: gate-plan
    - name: Install locked dependencies
      run: node scripts/gates/run-infrastructure.mjs --kind install --profile ${{ matrix.dependencyProfile }} --output gate-results -- npm ci --no-audit --no-fund
      timeout-minutes: 10
    - name: Restore checked supplier files
      id: supplier-cache
      if: ${{ runner.os != 'Linux' }}
      uses: actions/cache/restore@v4
      with:
        path: ${{ runner.temp }}/dsc-supplier-downloads/*.bin
        key: dsc-supplier-v1-${{ matrix.variant }}-25.6.0-16.17.1-22.3.14
      timeout-minutes: 2
    - name: Build and load native input
      env:
        DSC_SUPPLIER_DOWNLOAD_CACHE: ${{ runner.temp }}/dsc-supplier-downloads
      run: node scripts/gates/run-stage.mjs --plan gate-plan/gate-plan.json --job native-assets --variant "${{ matrix.variant }}" --output gate-results --assets "${{ runner.temp }}/native-assets/${{
        matrix.variant }}" --part load
    - name: Cache supplier files after successful native load
      if: ${{ runner.os != 'Linux' && steps.supplier-cache.outputs.cache-hit != 'true' }}
      uses: actions/cache/save@v4
      with:
        path: ${{ runner.temp }}/dsc-supplier-downloads/*.bin
        key: dsc-supplier-v1-${{ matrix.variant }}-25.6.0-16.17.1-22.3.14
      timeout-minutes: 2
    - name: Stage immutable load transfer
      shell: bash
      run: |-
        mkdir -p gate-transfer/native-load
        cp gate-transfer/native-archive/* gate-transfer/native-load/
        cp "gate-results/native-assets/${{ matrix.variant }}/native-load.task.json" gate-transfer/native-load/
    - name: Upload load input before operations
      uses: actions/upload-artifact@v4
      with:
        name: gate-native-load-${{ matrix.variant }}-${{ github.run_id }}-${{ github.run_attempt }}
        path: gate-transfer/native-load
        if-no-files-found: error
        retention-days: ${{ inputs.mode == 'release-tag' && 90 || 14 }}
    - name: Operate original native provider
      run: node scripts/gates/run-stage.mjs --plan gate-plan/gate-plan.json --job native-assets --variant "${{ matrix.variant }}" --output gate-results --assets "${{ runner.temp }}/native-assets/${{
        matrix.variant }}" --part operation
    - name: Collect bounded stage evidence
