          gate-results/infrastructure
        if-no-files-found: error
        retention-days: ${{ inputs.mode == 'release-tag' && 90 || 14 }}
    - name: Expose verified acceptance
      id: acceptance
      if: ${{ success() && steps.verify.outcome == 'success' }}
      run: echo "accepted=true" >> "$GITHUB_OUTPUT"
