name: Temporary 0.26.1 Screenshot Diagnosis

on:
  push:
    branches: [release-0261-combined-gate-temp]
    paths: [.github/workflows/release-0261-combined-gate-temp.yml]

permissions:
  contents: read
  actions: read

jobs:
  screenshot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.playwright-browsers
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 442822982f802f61cb0a4c8e6a4c103655f4ba50
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx --no-install playwright install --with-deps chromium
      - uses: actions/download-artifact@v4
        with:
          pattern: execution-native-*-38417836576
          merge-multiple: true
          path: ${{ runner.temp }}/execution-native-archives
          run-id: 38417836576
          github-token: ${{ github.token }}
      - run: |
          node scripts/build/assemble-execution-distribution-assets.mjs --source "$RUNNER_TEMP/execution-native-archives" --output "$RUNNER_TEMP/execution-native-platform" --input-sha 442822982f802f61cb0a4c8e6a4c103655f4ba50
          echo "DEV_SESSION_CANVAS_EXECUTION_ASSETS_SET=$RUNNER_TEMP/execution-native-platform" >> "$GITHUB_ENV"
      - run: npm run build
      - name: Original screenshot assertion
        run: npx --no-install playwright test --grep 'webview bundle emits ready and matches the baseline screenshot'
      - name: Finite font and platform inventory
        if: always()
        run: |
          {
            fc-match sans-serif
            fc-match 'Noto Sans CJK SC'
            fc-match 'Microsoft YaHei'
            fc-match 'PingFang SC'
            fc-list :lang=zh family | sort -u
            cat /etc/os-release
          } > "$RUNNER_TEMP/screenshot-fonts.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshot-diagnosis-${{ github.run_id }}
          path: |
            .debug/playwright/results/**/canvas-shell-baseline-actual.png
            .debug/playwright/results/**/canvas-shell-baseline-diff.png
            .debug/playwright/results/**/error-context.md
            tests/playwright/webview-harness.spec.mjs-snapshots/canvas-shell-baseline-linux.png
            ${{ runner.temp }}/screenshot-fonts.txt
          if-no-files-found: error
          retention-days: 14
          include-hidden-files: true
