name: Runtime macOS Native Failure

on:
  push:
    branches: [runtime-exit-integrity-native-candidates]
    paths:
      - .github/workflows/runtime-macos-native-failure.yml
      - scripts/diagnostics/build-macos-native-failure-v1.mjs
      - scripts/diagnostics/macos-native-failure-build-v1.test.mjs
      - scripts/diagnostics/macos-native-failure-support-v1.h
      - scripts/diagnostics/macos-native-failure-patch-v1.mjs
      - scripts/diagnostics/macos-native-failure-patch-v1.test.mjs
      - scripts/diagnostics/macos-native-failure-roles-v1.mjs
      - scripts/diagnostics/macos-native-failure-roles-v1.test.mjs
      - scripts/diagnostics/macos-native-failure-fixture-process-v1.mjs
      - scripts/diagnostics/macos-native-failure-fixture-v1.mjs
      - scripts/diagnostics/macos-native-failure-verifier-v1.mjs
      - scripts/diagnostics/macos-native-failure-v1.test.mjs
      - scripts/diagnostics/diagnose-macos-native-failure-v1.mjs
      - scripts/diagnostics/macos-native-failure-saved-v1.mjs
      - scripts/diagnostics/macos-native-failure-schedule-v1.test.mjs

permissions:
  contents: read

concurrency:
  group: runtime-macos-native-failure-${{ github.ref }}
  cancel-in-progress: false

jobs:
  failure:
    name: macOS U1-6 / Node 22.23.2
    runs-on: macos-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.2'
          cache: npm
      - name: Record exact runner inputs
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { execFileSync } from 'node:child_process';
          import { createHash } from 'node:crypto';
          import fs from 'node:fs';
          import os from 'node:os';
          import path from 'node:path';
          const directory = 'macos-native-failure-runner';
          fs.mkdirSync(directory);
          const files = [
            '.github/workflows/runtime-macos-native-failure.yml',
            'scripts/diagnostics/build-macos-native-failure-v1.mjs',
            'scripts/diagnostics/macos-native-failure-build-v1.test.mjs',
            'scripts/diagnostics/macos-native-failure-support-v1.h',
            'scripts/diagnostics/macos-native-failure-patch-v1.mjs',
            'scripts/diagnostics/macos-native-failure-patch-v1.test.mjs',
            'scripts/diagnostics/macos-native-failure-roles-v1.mjs',
            'scripts/diagnostics/macos-native-failure-roles-v1.test.mjs',
            'scripts/diagnostics/macos-native-failure-fixture-process-v1.mjs',
            'scripts/diagnostics/macos-native-failure-fixture-v1.mjs',
            'scripts/diagnostics/macos-native-failure-verifier-v1.mjs',
            'scripts/diagnostics/macos-native-failure-v1.test.mjs',
            'scripts/diagnostics/diagnose-macos-native-failure-v1.mjs',
            'scripts/diagnostics/macos-native-failure-saved-v1.mjs',
            'scripts/diagnostics/macos-native-failure-schedule-v1.test.mjs',
            'scripts/diagnostics/diagnose-native-failure-v1.mjs',
            'scripts/diagnostics/native-failure-verifier-v1.mjs',
            'docs/design-docs/runtime-native-failure-isolation.md',
            'package.json', 'package-lock.json',
            'extensions/vscode/dev-session-canvas/package.json',
          ];
          const sources = files.map(file => {
            const bytes = fs.readFileSync(file);
            const snapshot = path.join(directory, 'inputs', file);
            fs.mkdirSync(path.dirname(snapshot), { recursive: true });
            fs.writeFileSync(snapshot, bytes, { flag: 'wx' });
            return { file, snapshot, sha256: createHash('sha256').update(bytes).digest('hex') };
          });
          const metadata = {
            schema: 'macos-native-failure-runner-v1',
            commit: execFileSync('git', ['rev-parse', 'HEAD'], { encoding: 'utf8' }).trim(),
            githubSha: process.env.GITHUB_SHA, githubRef: process.env.GITHUB_REF,
            runId: process.env.GITHUB_RUN_ID, attempt: process.env.GITHUB_RUN_ATTEMPT,
            runnerOs: process.env.RUNNER_OS, runnerArch: process.env.RUNNER_ARCH,
            image: process.env.ImageOS, imageVersion: process.env.ImageVersion,
            platform: process.platform, arch: process.arch,
            osRelease: os.release(), osVersion: os.version(), versions: process.versions,
            executable: process.execPath, sources,
          };
          fs.writeFileSync(path.join(directory, 'environment.json'), JSON.stringify(metadata, null, 2) + '\n', { flag: 'wx' });
          assert.equal(metadata.commit, metadata.githubSha);
          assert.equal(process.platform, 'darwin');
          assert.equal(process.versions.node, '22.23.2');
          NODE
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund 2>&1 | tee macos-native-failure-runner/dependencies.log
      - name: Prepare matching Node headers
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/macos-native-failure-node-22.23.2"
          mkdir "$root"
          {
            curl --fail --location --retry 2 https://nodejs.org/dist/v22.23.2/node-v22.23.2-headers.tar.gz --output "$root/headers.tar.gz"
            shasum -a 256 "$root/headers.tar.gz"
            tar -xzf "$root/headers.tar.gz" -C "$root"
          } 2>&1 | tee macos-native-failure-runner/headers-preparation.log
          printf 'HEADERS=%s\n' "$root/node-v22.23.2" >> "$GITHUB_ENV"
      - name: Run focused pure tests
        run: DSC_NATIVE_HEADERS_ROOT="$HEADERS/include/node" node --test scripts/diagnostics/macos-native-failure-*.test.mjs 2>&1 | tee macos-native-failure-runner/pure-tests.log
      - name: Build isolated Darwin candidate and load without sessions
        run: node scripts/diagnostics/build-macos-native-failure-v1.mjs --output macos-native-failure-build --dependency-root "$PWD/node_modules" --headers "$HEADERS/include/node" 2>&1 | tee macos-native-failure-runner/build.log
      - name: Run the single three-case U1-6 schedule
        run: |
          node --input-type=module <<'NODE'
          import { spawnSync } from 'node:child_process';
          import fs from 'node:fs';
          import path from 'node:path';
          const args = ['scripts/diagnostics/diagnose-macos-native-failure-v1.mjs',
            '--output', 'macos-native-failure-evidence', '--binary', path.resolve('macos-native-failure-build/pty.node'),
            '--build-directory', path.resolve('macos-native-failure-build')];
          const startedAt = new Date().toISOString();
          const result = spawnSync(process.execPath, args, { encoding: 'utf8', timeout: 180000, maxBuffer: 32 * 1024 * 1024 });
          const record = { command: [process.execPath, ...args], startedAt, finishedAt: new Date().toISOString(),
            status: result.status, signal: result.signal, error: result.error?.message ?? null,
            stdout: result.stdout ?? '', stderr: result.stderr ?? '' };
          fs.writeFileSync('macos-native-failure-runner/native-run.json', JSON.stringify(record, null, 2) + '\n', { flag: 'wx' });
          process.stdout.write(record.stdout);
          process.stderr.write(record.stderr);
          process.exitCode = result.status === 0 && !result.signal && !result.error ? 0 : 1;
          NODE
      - name: Independently verify the saved schedule
        if: always()
        run: |
          if [ ! -d macos-native-failure-evidence ]; then
            printf 'No native evidence directory; no saved schedule can be accepted.\n' | tee macos-native-failure-runner/offline-verification.log
            exit 1
          fi
          node scripts/diagnostics/diagnose-macos-native-failure-v1.mjs --verify-saved macos-native-failure-evidence --build-directory macos-native-failure-build 2>&1 | tee macos-native-failure-runner/offline-verification.log
      - name: Upload complete evidence including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runtime-macos-native-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            macos-native-failure-runner/
            macos-native-failure-build/
            macos-native-failure-evidence/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14
