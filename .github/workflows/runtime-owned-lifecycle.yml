name: Runtime Owned Lifecycle

on:
  workflow_dispatch:
  push:
    branches: [runtime-exit-integrity-native-candidates]
    paths:
      - .github/workflows/runtime-owned-lifecycle.yml
      - scripts/diagnostics/diagnose-runtime-owned-lifecycle.mjs
      - scripts/diagnostics/runtime-owned-cancel-worker.mjs
      - scripts/diagnostics/native-runtime-resources.c

permissions:
  contents: read

concurrency:
  group: runtime-owned-lifecycle-${{ github.ref }}
  cancel-in-progress: false

jobs:
  owned-lifecycle:
    name: Owned lifecycle / ${{ matrix.os }} / Node 22
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
        with:
          arch: x64
      - name: Fetch matching Windows Node compilation inputs
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = node -p process.versions.node
          $root = Join-Path $env:RUNNER_TEMP "owned-node-$version"
          New-Item -ItemType Directory -Path $root | Out-Null
          curl.exe --fail --location --retry 2 "https://nodejs.org/dist/v$version/node-v$version-headers.tar.gz" --output "$root/headers.tar.gz"
          if ($LASTEXITCODE -ne 0) { throw 'Node headers download failed' }
          tar -xzf "$root/headers.tar.gz" -C $root
          if ($LASTEXITCODE -ne 0) { throw 'Node headers extraction failed' }
          curl.exe --fail --location --retry 2 "https://nodejs.org/dist/v$version/win-x64/node.lib" --output "$root/node.lib"
          if ($LASTEXITCODE -ne 0) { throw 'Node import library download failed' }
          "DSC_NODE_INCLUDE_DIR=$root/node-v$version/include/node" | Out-File -FilePath $env:GITHUB_ENV -Append
          "DSC_NODE_LIB=$root/node.lib" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Check syntax
        run: node --check scripts/diagnostics/diagnose-runtime-owned-lifecycle.mjs
      - name: Check ownership and resource counter controls
        env:
          DSC_OWNED_SELFTEST_EVIDENCE: owned-lifecycle-selftest
        run: node scripts/diagnostics/diagnose-runtime-owned-lifecycle.mjs --self-test
      - name: Run full platform schedule
        if: ${{ !cancelled() }}
        run: node scripts/diagnostics/diagnose-runtime-owned-lifecycle.mjs --output owned-lifecycle-evidence
      - name: Verify all saved evidence including failures
        if: always()
        run: node scripts/diagnostics/diagnose-runtime-owned-lifecycle.mjs --verify-saved owned-lifecycle-evidence
      - name: Upload full evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runtime-owned-lifecycle-${{ matrix.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            owned-lifecycle-evidence/
            owned-lifecycle-selftest/
          if-no-files-found: warn
          retention-days: 14
