name: Runtime Exit Integrity Candidate Probe

on:
  workflow_dispatch:
  push:
    branches: [runtime-exit-integrity-native-candidates]
    paths:
      - .github/workflows/runtime-exit-integrity-candidates.yml
      - scripts/diagnostics/compare-runtime-exit-readers.mjs
      - scripts/diagnostics/compare-windows-exit-readers.mjs
      - scripts/diagnostics/runtime-exit-conout-worker.mjs

permissions:
  contents: read

concurrency:
  group: runtime-exit-candidates-${{ github.ref }}
  cancel-in-progress: false

jobs:
  native-candidates:
    name: Native candidates / ${{ matrix.os }} / Node 22
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Check Unix candidate syntax
        run: node --check scripts/diagnostics/compare-runtime-exit-readers.mjs
      - name: Check Windows candidate syntax
        run: node --check scripts/diagnostics/compare-windows-exit-readers.mjs
      - name: Check output worker syntax
        run: node --check scripts/diagnostics/runtime-exit-conout-worker.mjs
      - name: Check Unix assertions
        run: node scripts/diagnostics/compare-runtime-exit-readers.mjs --self-test
      - name: Check Windows oracle and real socket worker
        run: node scripts/diagnostics/compare-windows-exit-readers.mjs --self-test
      - name: Compare Unix readers
        if: runner.os != 'Windows'
        run: node scripts/diagnostics/compare-runtime-exit-readers.mjs --output native-candidate-evidence
      - name: Compare Windows readers and lifecycle
        if: runner.os == 'Windows'
        run: node scripts/diagnostics/compare-windows-exit-readers.mjs --output native-candidate-evidence
      - name: Upload all evidence including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runtime-exit-candidates-${{ matrix.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: native-candidate-evidence/
          if-no-files-found: warn
          retention-days: 14
