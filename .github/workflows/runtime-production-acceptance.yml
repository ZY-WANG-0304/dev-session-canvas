name: Runtime Production Acceptance

on:
  workflow_dispatch:
  push:
    branches:
      - runtime-persistence-session-state-refactor
    paths:
      - .github/workflows/runtime-production-acceptance.yml

permissions:
  contents: read

concurrency:
  group: runtime-production-acceptance-${{ github.ref }}
  cancel-in-progress: false

jobs:
  native-assets:
    uses: ./.github/workflows/runtime-execution-assets.yml
    with:
      input_ref: ${{ github.sha }}

  package:
    needs: native-assets
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '25.6.0'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - uses: actions/download-artifact@v4
        with:
          pattern: execution-native-*-${{ github.run_id }}
          merge-multiple: true
          path: native-archives
      - name: Assemble same-commit production assets
        run: |
          node scripts/build/assemble-execution-distribution-assets.mjs --source native-archives --output generated/execution-assets --input-sha "$GITHUB_SHA"
          echo "DEV_SESSION_CANVAS_EXECUTION_ASSETS_SET=$GITHUB_WORKSPACE/generated/execution-assets" >> "$GITHUB_ENV"
      - name: Build and package through normal defaults
        run: |
          npm run build
          npm run package:vsix
          node --input-type=module <<'NODE'
          import fs from 'node:fs/promises';
          import { createHash } from 'node:crypto';
          const root = 'extensions/vscode/dev-session-canvas';
          const { name, version } = JSON.parse(await fs.readFile(`${root}/package.json`, 'utf8'));
          const bytes = await fs.readFile(`${name}-${version}.vsix`);
          await fs.mkdir('production-package');
          await fs.writeFile('production-package/product.vsix', bytes);
          await fs.writeFile('production-package/receipt.json', JSON.stringify({
            inputCommit: process.env.GITHUB_SHA, sha256: createHash('sha256').update(bytes).digest('hex'), name, version
          }, null, 2));
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: runtime-production-package-${{ github.run_id }}
          path: production-package/
          if-no-files-found: error
          retention-days: 14

  product:
    needs: package
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - os: ubuntu-22.04
            platform: linux
          - os: macos-15
            platform: macos
          - os: windows-2025
            platform: windows
    runs-on: ${{ matrix.os }}
    timeout-minutes: 55
    defaults:
      run:
        shell: bash
    steps:
      - name: Preserve source bytes on Windows checkout
        if: runner.os == 'Windows'
        shell: pwsh
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '25.6.0'
          cache: npm
      - name: Linux desktop and sandbox dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y xvfb xauth bubblewrap libgtk-3-0 libnss3 libasound2 libgbm1 libxss1 libxtst6
          bwrap --unshare-user --ro-bind / / /usr/bin/true
      - uses: actions/setup-python@v5
        if: runner.os == 'macOS'
        with:
          python-version: '3.12.10'
      - name: Darwin process observer
        if: runner.os == 'macOS'
        run: |
          python -m venv "$RUNNER_TEMP/agent-observer"
          "$RUNNER_TEMP/agent-observer/bin/python" -m pip install --only-binary=:all: --require-hashes --requirement scripts/test/fixtures/darwin-agent-observer-requirements.txt
          echo "DEV_SESSION_CANVAS_AGENT_OBSERVER_PYTHON=$RUNNER_TEMP/agent-observer/bin/python" >> "$GITHUB_ENV"
      - run: npm ci --no-audit --no-fund
      - uses: actions/download-artifact@v4
        with:
          name: runtime-production-package-${{ github.run_id }}
          path: production-package
      - name: Verify package identity and use its exact application bytes
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { createHash } from 'node:crypto';
          import fs from 'node:fs/promises';
          import path from 'node:path';
          import JSZip from 'jszip';
          const receipt = JSON.parse(await fs.readFile('production-package/receipt.json', 'utf8'));
          const bytes = await fs.readFile('production-package/product.vsix');
          assert.equal(receipt.inputCommit, process.env.GITHUB_SHA);
          assert.equal(receipt.sha256, createHash('sha256').update(bytes).digest('hex'));
          const zip = await JSZip.loadAsync(bytes);
          for (const entry of Object.values(zip.files)) {
            if (entry.dir || !entry.name.startsWith('extension/dist/')) continue;
            const relative = entry.name.slice('extension/'.length);
            assert(!relative.split('/').includes('..'));
            const target = path.join('extensions/vscode/dev-session-canvas', relative);
            await fs.mkdir(path.dirname(target), { recursive: true });
            await fs.writeFile(target, await entry.async('nodebuffer'), { mode: entry.unixPermissions ? entry.unixPermissions & 0o777 : 0o644 });
          }
          const selection = JSON.parse(await fs.readFile('extensions/vscode/dev-session-canvas/dist/execution-candidate-selection.json', 'utf8'));
          assert.equal(selection.profile, 'platform');
          assert.deepEqual(selection.admissionLimits, { executions: null, starting: 1, pending: 2 });
          NODE
      - name: Prepare fixed VS Code
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs/promises';
          import path from 'node:path';
          import { downloadAndUnzipVSCode } from '@vscode/test-electron';
          const platform = process.platform === 'win32' ? 'win32-x64-archive'
            : process.platform === 'darwin' ? 'darwin-arm64' : 'linux-x64';
          const executable = await downloadAndUnzipVSCode({ version: '1.117.0', platform,
            cachePath: path.join(process.env.RUNNER_TEMP, 'product-vscode') });
          await fs.appendFile(process.env.GITHUB_ENV, `DEV_SESSION_CANVAS_VSCODE_EXECUTABLE=${executable}\n`);
          NODE
      - name: Installed Terminal and Webview final acceptance
        id: installed
        run: node scripts/smoke/run-vscode-execution-candidate.mjs --installed-vsix production-package/product.vsix --output "$RUNNER_TEMP/dsc-installed"
      - name: Upload installed evidence before Agent credentials are available
        if: always() && steps.installed.outcome != 'skipped'
        uses: actions/upload-artifact@v4
        with:
          name: runtime-production-installed-${{ matrix.platform }}-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/dsc-installed/input.json
            ${{ runner.temp }}/dsc-installed/installed-vsix-input.json
            ${{ runner.temp }}/dsc-installed/first-failure.json
            ${{ runner.temp }}/dsc-installed/*/artifacts/*.json
          if-no-files-found: error
          retention-days: 14
      - name: Install fixed real Agent CLIs
        run: npm install --global --no-audit --no-fund @openai/codex@0.157.1 @anthropic-ai/claude-code@2.1.280
      - name: Real Agent final acceptance
        id: real_agents
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          umask 077
          if node scripts/smoke/run-vscode-agent-candidate.mjs --backend=deepseek --ci-report agent-ci-report --output "$RUNNER_TEMP/dsc-agent" > "$RUNNER_TEMP/agent-candidate.log" 2>&1; then
            echo 'Real Agent acceptance passed; sanitized report: agent-ci-report/'
          else
            echo 'Real Agent acceptance failed; sanitized report: agent-ci-report/' >&2
            exit 1
          fi
      - name: Upload sanitized Agent evidence only
        if: always() && steps.real_agents.outputs.report_ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: runtime-production-agent-${{ matrix.platform }}-${{ github.run_id }}
          path: agent-ci-report/
          if-no-files-found: error
          retention-days: 14
