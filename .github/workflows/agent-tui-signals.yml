name: Agent TUI Signal Exploration
on:
  workflow_dispatch:
  push:
    branches: [smoke-real-tui-scenario-coverage]
    paths:
      - .github/workflows/agent-tui-signals.yml
      - scripts/diagnostics/probe-agent-tui-signals.mjs
      - scripts/smoke/agent-tui-configuration.mjs
      - tests/vscode-smoke/agent-tui-hook.cjs
      - tests/vscode-smoke/agent-tui-tool.cjs
permissions:
  contents: read
jobs:
  signals:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        provider: [codex, claude]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 25.6.0
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm install --prefix "$RUNNER_TEMP/tui-cli" --no-audit --no-fund @openai/codex@0.157.1 @anthropic-ai/claude-code@2.1.280
      - name: Probe fixed interactive CLI
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          TUI_PROVIDER: ${{ matrix.provider }}
        run: node scripts/diagnostics/probe-agent-tui-signals.mjs --provider "$TUI_PROVIDER" --cli-root "$RUNNER_TEMP/tui-cli" --output "$RUNNER_TEMP/tui-evidence"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tui-signals-${{ matrix.provider }}
          path: |
            ${{ runner.temp }}/tui-evidence/probe.json
            ${{ runner.temp }}/tui-evidence/events.jsonl
            ${{ runner.temp }}/tui-evidence/tool-start.json
            ${{ runner.temp }}/tui-evidence/tool-end.json
          if-no-files-found: error
