name: Systemd Smoke Scope Root Cause

on:
  workflow_dispatch:
  push:
    branches: [docs-systemd-smoke-scope-root-cause]
    paths:
      - .github/workflows/systemd-smoke-scope-root-cause.yml
      - docs/references/systemd-smoke-scope-root-cause/instrument-systemd-scope.mjs

permissions:
  contents: read
  actions: read

jobs:
  systemd-scope-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout diagnostic tool
        uses: actions/checkout@v4
        with:
          path: diagnostic-input
          persist-credentials: false
      - name: Preserve finite tool outside tested workspace
        run: |
          cp diagnostic-input/docs/references/systemd-smoke-scope-root-cause/instrument-systemd-scope.mjs "$RUNNER_TEMP/instrument-systemd-scope.mjs"
          echo "DSC_SYSTEMD_RCA_TRACE_FILE=$RUNNER_TEMP/systemd-scope-trace.jsonl" >> "$GITHUB_ENV"
      - name: Checkout exact failing combined input
        uses: actions/checkout@v4
        with:
          ref: 08f7b0a52f5af27ced04b00a839f525a92659d63
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install original locked dependencies
        run: npm ci
      - name: Download original same-input native assets
        uses: actions/download-artifact@v4
        with:
          pattern: execution-native-*-38387068827
          merge-multiple: true
          path: ${{ runner.temp }}/native-archives
          run-id: 38387068827
          github-token: ${{ github.token }}
      - name: Assemble original native assets
        run: |
          node scripts/build/assemble-execution-distribution-assets.mjs --source "$RUNNER_TEMP/native-archives" --output "$RUNNER_TEMP/native-platform" --input-sha 08f7b0a52f5af27ced04b00a839f525a92659d63
          echo "DEV_SESSION_CANVAS_EXECUTION_ASSETS_SET=$RUNNER_TEMP/native-platform" >> "$GITHUB_ENV"
      - name: Trace original systemd-user scene without changing assertions
        env:
          DEV_SESSION_CANVAS_SMOKE_SCENARIO_FILTER: systemd-user-real-reopen
        run: |
          node "$RUNNER_TEMP/instrument-systemd-scope.mjs"
          npm run build
          node scripts/smoke/run-vscode-smoke.mjs
      - name: Preserve finite trace and restore source
        if: always()
        run: |
          python3 - <<'PY'
          import json, os, pathlib
          trace = pathlib.Path(os.environ['DSC_SYSTEMD_RCA_TRACE_FILE'])
          rows = [json.loads(line) for line in trace.read_text().splitlines()] if trace.exists() else []
          assert len(rows) <= 100, 'Diagnostic unexpectedly exceeded finite trace limit'
          summary = {'diagnostic_only': True, 'input': '08f7b0a52f5af27ced04b00a839f525a92659d63', 'rows': rows}
          (pathlib.Path(os.environ['RUNNER_TEMP']) / 'systemd-scope-summary.json').write_text(json.dumps(summary, indent=2))
          print(json.dumps(summary))
          for file in ['extensions/vscode/dev-session-canvas/src/supervisor/runtimeRootPreparation.ts', 'extensions/vscode/dev-session-canvas/src/panel/runtimeSystemdEnvironment.ts']:
            source = pathlib.Path(file)
            backup = pathlib.Path(file + '.systemd-rca-original')
            if backup.exists(): source.write_bytes(backup.read_bytes()); backup.unlink()
          PY
      - name: Upload finite scope evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: systemd-scope-root-cause-${{ github.run_id }}
          path: ${{ runner.temp }}/systemd-scope-summary.json
          if-no-files-found: error
          retention-days: 14
