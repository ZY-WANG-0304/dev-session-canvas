name: Temporary Runtime Retirement Release Verification
on:
  push:
    branches: [smoke-runtime-retirement-source-release-ci-temp]
    paths: [.github/workflows/smoke-runtime-retirement-source-release-ci-temp.yml]
permissions: {contents: read, actions: read}
jobs:
  native-assets:
    uses: ./.github/workflows/runtime-execution-assets.yml
    with:
      input_ref: 55c619ad70dbec74a7f9ffab17bf3dc547bd6913
  full-release:
    needs: native-assets
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.playwright-browsers
      DEV_SESSION_CANVAS_TEMPLATE_MARKETPLACE_VSCODE_E2E_HOST_TMP_ROOT: /tmp/tm-${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0, ref: 55c619ad70dbec74a7f9ffab17bf3dc547bd6913}
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm}
      - run: npm ci
      - run: npx --no-install playwright install --with-deps chromium
      - uses: actions/download-artifact@v4
        with:
          pattern: execution-native-*-${{ github.run_id }}
          merge-multiple: true
          path: ${{ runner.temp }}/execution-native-archives
      - name: Assemble same-ref same-run assets
        run: |
          node scripts/build/assemble-execution-distribution-assets.mjs --source "$RUNNER_TEMP/execution-native-archives" --output "$RUNNER_TEMP/execution-native-platform" --input-sha 55c619ad70dbec74a7f9ffab17bf3dc547bd6913
          echo "DEV_SESSION_CANVAS_EXECUTION_ASSETS_SET=$RUNNER_TEMP/execution-native-platform" >> "$GITHUB_ENV"
      - name: Full unchanged release gate
        shell: bash
        run: |
          set -o pipefail
          npm run release:verify -- --version 0.26.1 2>&1 | tee release-verify.log
      - name: Collect bounded original gate evidence
        if: always()
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import tarfile,json,subprocess,os
          manifest=Path(os.environ.get('DEV_SESSION_CANVAS_EXECUTION_ASSETS_SET','/nonexistent'))/'manifest.json'
          Path('release-input.json').write_text(json.dumps({'input':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),'run':'${{ github.run_id }}','node':subprocess.check_output(['node','--version'],text=True).strip(),'assetManifest':json.loads(manifest.read_text()) if manifest.exists() else None},indent=2)+'\n')
          roots=list(Path('/tmp').glob('dev-session-canvas-clean-checkout-*/repo/.debug'))
          roots += [Path('.debug'),Path('test-results')]
          files=[Path('release-verify.log'),Path('release-input.json')]
          for root in roots:
            if root.exists():
              for p in root.rglob('*'):
                if p.is_file() and p.stat().st_size<=16*1024*1024 and ('/artifacts/' in str(p) or '/user-data/logs/' in str(p) or 'test-results' in str(p)):
                  files.append(p)
          seen=set();total=0;inventory=[]
          with tarfile.open('release-evidence.tar.gz','w:gz') as tar:
            for p in files:
              if str(p) in seen:continue
              seen.add(str(p));size=p.stat().st_size
              if total+size>400*1024*1024:inventory.append({'path':str(p),'bytes':size,'omitted':'total bound'});continue
              arc=str(p).lstrip('/') if p.is_absolute() else str(p)
              tar.add(p,arcname=arc);total+=size;inventory.append({'path':str(p),'bytes':size,'archived':arc})
          Path('evidence-inventory.json').write_text(json.dumps({'bytes':total,'files':inventory},indent=2)+'\n')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: runtime-retirement-full-release-${{ github.run_id }}
          path: |
            release-evidence.tar.gz
            evidence-inventory.json
