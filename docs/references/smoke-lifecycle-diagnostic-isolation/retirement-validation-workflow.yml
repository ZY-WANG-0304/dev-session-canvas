name: Temporary Runtime Retirement Release Verification
on:
  push:
    branches: [smoke-runtime-retirement-release-ci-final-temp]
    paths: [.github/workflows/smoke-runtime-retirement-release-ci-final-temp.yml]
permissions: {contents: read, actions: read}
jobs:
  native-assets:
    uses: ./.github/workflows/runtime-execution-assets.yml
    with:
      input_ref: 675c2ea03c61d0f09e18e6497e5593d13966f87d
  full-release:
    needs: native-assets
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.playwright-browsers
      DEV_SESSION_CANVAS_TEMPLATE_MARKETPLACE_VSCODE_E2E_HOST_TMP_ROOT: /tmp/tm-${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0, ref: 675c2ea03c61d0f09e18e6497e5593d13966f87d}
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm}
      - run: npm ci
      - run: npx --no-install playwright install --with-deps chromium
      - uses: actions/download-artifact@v4
        with:
          pattern: execution-native-*-${{ github.run_id }}
          merge-multiple: true
          path: ${{ runner.temp }}/execution-native-archives
      - name: Assemble same-ref same-run assets
        run: |
          node scripts/build/assemble-execution-distribution-assets.mjs --source "$RUNNER_TEMP/execution-native-archives" --output "$RUNNER_TEMP/execution-native-platform" --input-sha 675c2ea03c61d0f09e18e6497e5593d13966f87d
          echo "DEV_SESSION_CANVAS_EXECUTION_ASSETS_SET=$RUNNER_TEMP/execution-native-platform" >> "$GITHUB_ENV"
      - name: Full unchanged release gate
        shell: bash
        run: |
          set -o pipefail
          npm run release:verify -- --version 0.26.1 2>&1 | tee release-verify.log
      - name: Collect bounded original gate evidence
        if: always()
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import tarfile,json,subprocess,os
          manifest=Path(os.environ.get('DEV_SESSION_CANVAS_EXECUTION_ASSETS_SET','/nonexistent'))/'manifest.json'
          Path('release-input.json').write_text(json.dumps({'input':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),'run':'${{ github.run_id }}','node':subprocess.check_output(['node','--version'],text=True).strip(),'assetManifest':json.loads(manifest.read_text()) if manifest.exists() else None},indent=2)+'\n')
          roots=list(Path('/tmp').glob('dev-session-canvas-clean-checkout-*/repo/.debug'))
          roots += [Path('.debug'),Path('test-results')]
          files=[Path('release-verify.log'),Path('release-input.json')]
          for root in roots:
            if root.exists():
              for p in root.rglob('*'):
                if p.is_file() and p.stat().st_size<=16*1024*1024 and (p.suffix in ('.log','.json','.jsonl','.txt','.png','.webm') or '/artifacts/' in str(p)):
                  files.append(p)
          seen=set();total=0;inventory=[]
          with tarfile.open('release-evidence.tar.gz','w:gz') as tar:
            for p in files:
              if str(p) in seen:continue
              seen.add(str(p));size=p.stat().st_size
              if total+size>400*1024*1024:inventory.append({'path':str(p),'bytes':size,'omitted':'total bound'});continue
              arc=str(p).lstrip('/') if p.is_absolute() else str(p)
              tar.add(p,arcname=arc);total+=size;inventory.append({'path':str(p),'bytes':size,'archived':arc})
          Path('evidence-inventory.json').write_text(json.dumps({'bytes':total,'files':inventory},indent=2)+'\n')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: runtime-retirement-full-release-${{ github.run_id }}
          path: |
            release-evidence.tar.gz
            evidence-inventory.json
  delayed-original-retirement:
    needs: native-assets
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    env:
      DEV_SESSION_CANVAS_SMOKE_SCENARIO_FILTER: trusted
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0, ref: 675c2ea03c61d0f09e18e6497e5593d13966f87d}
      - name: Extract finite validation from workflow ref
        run: git fetch origin "${{ github.sha }}" && git show "${{ github.sha }}:retirement-validation-probe.py" > retirement-validation-probe.py
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm}
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          pattern: execution-native-*-${{ github.run_id }}
          merge-multiple: true
          path: archives
      - run: |
          node scripts/build/assemble-execution-distribution-assets.mjs --source archives --output platform --input-sha 675c2ea03c61d0f09e18e6497e5593d13966f87d
          echo "DEV_SESSION_CANVAS_EXECUTION_ASSETS_SET=$GITHUB_WORKSPACE/platform" >> "$GITHUB_ENV"
          echo "DSC_RETIREMENT_TRACE=$RUNNER_TEMP/retirement-validation.jsonl" >> "$GITHUB_ENV"
      - run: python3 retirement-validation-probe.py
      - name: Original packaged trusted with actual helper and bounded old deletion
        run: |
          set +e
          timeout --signal=TERM --kill-after=20s 420s npm run validate:clean-checkout:vsix -- --source working-tree --keep-temp > packaged.log 2>&1
          code=$?
          echo "$code" > packaged.exit
          python3 - <<'PY'
          import os,json
          from pathlib import Path
          code=int(Path('packaged.exit').read_text());log=Path('packaged.log').read_text()
          trace=Path(os.environ['DSC_RETIREMENT_TRACE']);events=[json.loads(l) for l in trace.read_text().splitlines()] if trace.exists() else []
          markers=[json.loads(l.split('[retirement-validation] ',1)[1]) for l in log.splitlines() if '[retirement-validation] ' in l]
          Path('retirement-native-result.json').write_text(json.dumps({'exit':code,'events':events,'markers':markers},indent=2)+'\n')
          assert code==0 and 'VSIX packaged-payload smoke passed (trusted).' in log
          before=next(m for m in markers if m['stage']=='before-stop');after=next(m for m in markers if m['stage']=='original-helper-returned')
          assert after['elapsedMs']<15000
          for sid in before['ids']:
            begin=next(e for e in events if e['stage']=='bounded-delete-delay' and e['detail']['sessionId']==sid)
            end=next(e for e in events if e['stage']=='remove-finished' and e['detail']['sessionId']==sid)
            assert any(e['stage']=='retirement-query' and e['detail']['sessionId']==sid and e['detail']['exists'] and begin['at']<=e['at']<end['at'] for e in events)
            assert any(e['stage']=='retirement-query' and e['detail']['sessionId']==sid and e['detail']['exists'] is False and end['at']<=e['at']<=after['at'] for e in events)
            assert end['at']<=after['at']
          subsequent=[e for e in events if e['stage']=='create-admission' and e['at']>=after['at']]
          assert subsequent and all(s['id'] not in before['ids'] for s in subsequent[0]['detail']['sessions'])
          print(json.dumps({'smoke_exit':code,'original_ids':before['ids'],'elapsedMs':after['elapsedMs'],'causal_assertions':'passed'}))
          PY
      - name: Collect bounded native diagnostics
        if: always()
        run: |
          python3 - <<'PY'
          import os,re,tarfile
          from pathlib import Path
          files=[Path('packaged.log'),Path('packaged.exit'),Path('retirement-native-result.json'),Path('retirement-probe-input.json'),Path(os.environ.get('DSC_RETIREMENT_TRACE','/nonexistent'))]
          log=Path('packaged.log').read_text() if Path('packaged.log').exists() else ''
          for root in re.findall(r'准备隔离 clean checkout 验证目录: (.+)',log):
            debug=Path(root)/'.debug'
            if debug.exists():files += [p for p in debug.rglob('*') if p.is_file() and p.stat().st_size<16*1024*1024 and (p.suffix in ('.log','.json','.jsonl','.txt') or '/artifacts/' in str(p))]
          with tarfile.open('retirement-native-evidence.tar.gz','w:gz') as tar:
            for p in files:
              if p.exists():tar.add(p,arcname=str(p).lstrip('/'))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: 'runtime-retirement-delayed-${{ github.run_id }}', path: retirement-native-evidence.tar.gz}
