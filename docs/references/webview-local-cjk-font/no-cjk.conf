<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <include>/etc/fonts/fonts.conf</include>
  <selectfont><rejectfont>
    <glob>*/Noto*CJK*</glob>
    <glob>*/wqy/*</glob>
    <glob>*/unifont/*</glob>
    <glob>*/fonts-japanese*</glob>
  </rejectfont></selectfont>
</fontconfig>
