<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dev Session Canvas Webview Harness</title>
    <link rel="stylesheet" href="../../../dist/webview.css" />
  </head>
  <body>
    <div id="app"></div>
    <script>
      (() => {
        window.__DEV_SESSION_CANVAS_WEBVIEW_IDENTITY__ =
          window.__DEV_SESSION_CANVAS_WEBVIEW_IDENTITY__ ?? {
            surface: 'panel',
            mode: 'active',
            generation: 1
          };
        const postedMessages = [];
        let persistedState = window.__devSessionCanvasHarnessInitialPersistedState ?? {};
        let resolvedExecutionFileLinkTexts = null;
        let executionFileLinkResolutionDelayMs = 0;
        let holdExecutionFileLinkResponses = false;
        const heldExecutionFileLinkResponses = [];

        window.acquireVsCodeApi = function acquireVsCodeApi() {
          return {
            getState() {
              return persistedState;
            },
            setState(nextState) {
              persistedState = nextState;
            },
            postMessage(message) {
              postedMessages.push(message);
              if (message?.type === 'webview/resolveExecutionFileLinks') {
                const resolvedLinks = Array.isArray(message.payload?.candidates)
                  ? message.payload.candidates
                      .filter((candidate) => {
                        if (!Array.isArray(resolvedExecutionFileLinkTexts)) {
                          return true;
                        }

                        return resolvedExecutionFileLinkTexts.includes(candidate.text);
                      })
                      .map((candidate) => ({
                        candidateId: candidate.candidateId,
                        link: {
                          linkKind: 'file',
                          text: candidate.text,
                          path: candidate.path,
                          line: candidate.line,
                          column: candidate.column,
                          lineEnd: candidate.lineEnd,
                          columnEnd: candidate.columnEnd,
                          bufferStartLine: candidate.bufferStartLine,
                          source: candidate.source,
                          resolvedId: `harness-${candidate.candidateId}`,
                          targetKind: 'file'
                        }
                      }))
                  : [];
                const respond = () => {
                  window.postMessage(
                    attachHarnessLifecycle({
                      type: 'host/executionFileLinksResolved',
                      payload: {
                        requestId: message.payload?.requestId,
                        nodeId: message.payload?.nodeId,
                        kind: message.payload?.kind,
                        resolvedLinks
                      }
                    }),
                    '*'
                  );
                };
                if (holdExecutionFileLinkResponses) {
                  heldExecutionFileLinkResponses.push(respond);
                } else if (executionFileLinkResolutionDelayMs > 0) {
                  window.setTimeout(respond, executionFileLinkResolutionDelayMs);
                } else {
                  respond();
                }
              }
              window.dispatchEvent(
                new CustomEvent('dev-session-canvas:harness-post-message', {
                  detail: message
                })
              );
            }
          };
        };

        function attachHarnessLifecycle(message) {
          if (!message || typeof message !== 'object' || message.lifecycle !== undefined) {
            return message;
          }

          return {
            ...message,
            lifecycle: window.__DEV_SESSION_CANVAS_WEBVIEW_IDENTITY__
          };
        }

        window.__devSessionCanvasHarness = {
          dispatchHostMessage(message) {
            window.postMessage(attachHarnessLifecycle(message), '*');
          },
          dispatchRawHostMessage(message) {
            window.postMessage(message, '*');
          },
          bootstrap(
            state,
            runtime = {
              workspaceTrusted: true,
              surfaceLocation: 'panel',
              defaultAgentProvider: 'codex',
              strongTerminalAttentionReminderMode: 'both',
              terminalScrollback: 1000,
              editorMultiCursorModifier: 'alt',
              terminalWordSeparators: ' ()[]{}\',"`',
              overviewMode: 'title',
              overviewZoomThreshold: 0.2,
              filesEnabled: true,
              filePresentationMode: 'nodes',
              fileNodeDisplayStyle: 'minimal',
              fileNodeDisplayMode: 'icon-path',
              filePathDisplayMode: 'basename',
              fileIconFontFaces: []
            }
          ) {
            this.dispatchHostMessage({
              type: 'host/bootstrap',
              payload: {
                state,
                runtime
              }
            });
          },
          update(
            state,
            runtime = {
              workspaceTrusted: true,
              surfaceLocation: 'panel',
              defaultAgentProvider: 'codex',
              strongTerminalAttentionReminderMode: 'both',
              terminalScrollback: 1000,
              editorMultiCursorModifier: 'alt',
              terminalWordSeparators: ' ()[]{}\',"`',
              overviewMode: 'title',
              overviewZoomThreshold: 0.2,
              filesEnabled: true,
              filePresentationMode: 'nodes',
              fileNodeDisplayStyle: 'minimal',
              fileNodeDisplayMode: 'icon-path',
              filePathDisplayMode: 'basename',
              fileIconFontFaces: []
            }
          ) {
            this.dispatchHostMessage({
              type: 'host/stateUpdated',
              payload: {
                state,
                runtime
              }
            });
          },
          getPostedMessages() {
            return postedMessages.slice();
          },
          setResolvedExecutionFileLinkTexts(texts) {
            resolvedExecutionFileLinkTexts = Array.isArray(texts) ? texts.slice() : null;
          },
          setExecutionFileLinkResolutionDelayMs(delayMs) {
            executionFileLinkResolutionDelayMs =
              Number.isFinite(delayMs) && delayMs > 0 ? delayMs : 0;
          },
          setHoldExecutionFileLinkResponses(holdResponses) {
            holdExecutionFileLinkResponses = Boolean(holdResponses);
          },
          flushExecutionFileLinkResponses(count = heldExecutionFileLinkResponses.length) {
            const responses = heldExecutionFileLinkResponses.splice(0, Math.max(0, count));
            responses.forEach((respond) => respond());
            return responses.length;
          },
          clearPostedMessages() {
            postedMessages.length = 0;
          },
          getPersistedState() {
            return persistedState;
          }
        };
      })();
    </script>
    <script src="../../../dist/webview.js"></script>
  </body>
</html>
